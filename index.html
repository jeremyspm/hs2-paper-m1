<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HS2 · Paper Sim — Module 1</title>
<style>
/* ── estate tokens (house.css contract, dark default) ─────────────── */
:root{
  --bg:hsl(225 33% 5%); --fg:hsl(225 31% 95%); --card:hsl(224 44% 10%);
  --primary:hsl(218 91% 64%); --onprimary:hsl(225 33% 5%);
  --muted:hsl(220 38% 13%); --muted-fg:hsl(218 19% 67%);
  --accent:hsl(219 40% 18%); --danger:hsl(0 84% 60%); --ok:hsl(158 64% 42%);
  --warn:hsl(38 92% 55%); --border:hsl(222 27% 19%); --radius:.625rem;
  --dur:200ms; --ease:cubic-bezier(.4,0,.2,1);
}
:root[data-theme=light]{
  --bg:hsl(214 47% 97%); --fg:hsl(222 47% 11%); --card:hsl(0 0% 100%);
  --onprimary:#fff; --muted:hsl(215 40% 93%); --muted-fg:hsl(220 12% 40%);
  --accent:hsl(216 45% 91%); --border:hsl(215 33% 89%); --warn:hsl(38 92% 40%);
}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;padding:10px 14px}
header h1{font-size:1rem;margin:0;flex:1;font-weight:700}
header .d{color:var(--muted-fg);font-size:.8rem;white-space:nowrap}
main{max-width:720px;margin:0 auto;padding:14px 14px 90px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;margin:0 0 12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
  border:1px solid var(--border);background:var(--muted);color:var(--fg);
  border-radius:var(--radius);padding:10px 14px;font:inherit;font-weight:600;
  transition:background var(--dur) var(--ease)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--onprimary)}
.btn.ghost{background:transparent}
.btn.wide{width:100%;margin-top:8px}
a.btn{text-decoration:none}
.btn:disabled{opacity:.45;cursor:default}
.door h2{margin:.1rem 0 .3rem;font-size:1.02rem}
.door p{margin:.2rem 0 .6rem;color:var(--muted-fg);font-size:.88rem}
.qlist{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.qrow{display:flex;align-items:center;gap:8px;border:1px solid var(--border);
  border-radius:var(--radius);padding:8px 10px;background:var(--muted)}
.qrow b{flex:1;font-size:.86rem;font-weight:600}
.qrow .m{color:var(--muted-fg);font-size:.76rem;white-space:nowrap}
.sysrow{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px}
.tag{font-size:.72rem;padding:2px 8px;border-radius:99px;background:var(--accent);color:var(--muted-fg)}
.tag.cvs{color:hsl(0 84% 70%)}.tag.resp{color:hsl(199 89% 64%)}.tag.lymph{color:hsl(140 55% 58%)}
.tag.mixed{color:var(--muted-fg)}
/* sitting */
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.qhead .n{font-weight:700}
.qhead .timer{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted-fg)}
.qhead .timer.low{color:var(--danger);font-weight:700}
.stem{white-space:pre-wrap;margin-bottom:10px}
.stem img,.qimg{max-width:100%;border-radius:8px;background:#fff;display:block;margin:8px 0}
/* structured stem: her paragraphs, lists and table rows survive; a Canvas layout
   table becomes stacked cells at phone width and side-by-side from 560px */
.stem.rich{white-space:normal;line-height:1.5}
.stem.rich p{margin:.4em 0}
.stem.rich ul,.stem.rich ol{margin:.3em 0;padding-left:1.35em}
.stem.rich li{margin:.15em 0}
.stem.rich li>p{margin:.1em 0}
.stem.rich div{margin:.15em 0}
.stem.rich .tbl{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.stem.rich .tr{display:flex;flex-wrap:wrap;gap:8px 14px;border:1px solid var(--border);border-radius:8px;padding:8px 10px;background:var(--muted)}
.stem.rich .td{flex:1 1 220px;min-width:0}
.stem.rich .td>p:first-child{margin-top:0}
.stem.rich .td img{margin:0 0 4px;max-height:280px;width:auto}
.stem.rich img{max-height:520px;width:auto}
.inl{display:inline-block;width:auto;max-width:100%;padding:5px 8px;margin:2px 0;vertical-align:baseline;
  font-size:.95em;border:1px solid var(--primary);background:var(--card);color:var(--fg);border-radius:6px}
input.inl{min-width:7ch}
.inl:focus{outline:2px solid var(--primary);outline-offset:1px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);
  border-radius:var(--radius);padding:10px;margin:6px 0;cursor:pointer;background:var(--muted)}
.opt input{margin-top:3px;flex:none}
.opt.sel{border-color:var(--primary);background:var(--accent)}
.blankrow{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.blankrow label{font-size:.82rem;color:var(--muted-fg)}
select,input[type=text],textarea{font:inherit;color:var(--fg);background:var(--muted);
  border:1px solid var(--border);border-radius:8px;padding:9px;width:100%}
textarea{min-height:120px}
.pips{display:flex;gap:3px;flex-wrap:wrap;margin:10px 0 2px}
.pip{width:14px;height:6px;border-radius:3px;background:var(--muted);border:1px solid var(--border)}
.pip.done{background:var(--primary);border-color:var(--primary)}
.pip.cur{outline:2px solid var(--primary);outline-offset:1px}
/* marking */
.mk{border-left:4px solid var(--border);padding-left:10px;margin:14px 0}
.mk.right{border-color:var(--ok)}.mk.wrong{border-color:var(--danger)}
.mk .you{color:var(--muted-fg);font-size:.9rem}
.mk .keyline{color:var(--ok);font-weight:600}
.mk .marks{font-size:.8rem;color:var(--muted-fg)}
.steps label{display:flex;gap:8px;align-items:flex-start;margin:6px 0;cursor:pointer}
.refq{font-size:.85rem;color:var(--muted-fg);margin:8px 0 2px;padding:8px 10px;background:var(--muted);border-radius:8px}
.refq.slide{padding:6px}
.slideimg{max-width:100%;background:#fff;border-radius:6px;display:block;margin:0 0 4px}
.keyrows{margin:6px 0}
.krow{font-size:.85rem;padding:3px 0;border-bottom:1px dashed var(--border)}
.krow b{color:var(--ok);font-weight:600}
.krow.kok{opacity:.55}
.kyou{color:var(--danger);font-size:.78rem}
.refsrc{font-size:.74rem;color:var(--muted-fg);opacity:.8}
.vidrow{font-size:.86rem;margin:6px 0}
.vidrow a{font-weight:600}
.askai{padding:3px 10px;font-size:.76rem;margin-top:6px}
.score-hero{font-size:2.2rem;font-weight:800;text-align:center;margin:.3rem 0 0}
.score-sub{text-align:center;color:var(--muted-fg);margin:0 0 10px}
/* chart */
.spark{width:100%;height:84px;display:block}
.hist{font-size:.82rem;color:var(--muted-fg)}
.hist td{padding:2px 8px 2px 0}
/* chain warmup */
.chain{display:flex;flex-direction:column;gap:2px;margin:8px 0}
.bead{background:var(--accent);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:.9rem}
.bead.blank{border-style:dashed;color:var(--warn);text-align:center}
.verb{color:var(--muted-fg);font-size:.78rem;padding:0 12px}
.note{border:1px solid var(--border);border-left:4px solid var(--warn);border-radius:8px;
  padding:8px 10px;font-size:.84rem;color:var(--muted-fg);margin:10px 0}
.src{font-size:.75rem;color:var(--muted-fg);margin-top:6px}
dialog{background:var(--card);color:var(--fg);border:1px solid var(--border);
  border-radius:var(--radius);max-width:640px;width:calc(100% - 32px);padding:18px}
dialog::backdrop{background:rgb(0 0 0 / .6)}
h3{margin:14px 0 4px;font-size:.95rem}
.footbar{position:fixed;bottom:0;left:0;right:0;background:var(--bg);
  border-top:1px solid var(--border);padding:10px 14px;display:none;gap:8px;z-index:5}
.footbar.on{display:flex}
.footbar .btn{flex:1}
a{color:var(--primary)}
</style>
</head>

,"q":"Anatomical Structures of the Heart Identify the structures in the image below.","imgs":["HS2IMG-2e09eea0b25f8da4.png"],"qh":"<p><strong>Anatomical Structures of the Heart</strong></p> <p>Identify the structures in the image below.</p> <p>[[IMG:HS2IMG-2e09eea0b25f8da4.png]]</p>","qt":"Anatomical Structures of the Heart Identify the structures in the image below.","type":"match","pairs":[{"left":"L","right":"Superior Vena Cava"},{"left":"I","right":"Interior Vena Cava"},{"left":"A","right":"Pulmonary Artery"},{"left":"E","right":"Papillary Muscle"}],"vid":{"id":"UPOxrE79uCE","t":"Best way to draw and label the heart! | Heart Anatomy","d":"10:37","at":348,"alt":{"id":"KEfwq5A48kw","t":"Heart Circulation | Cardiology","d":"6:38","at":281}}},{"id":"qf41e8746af","quiz":"211012","sys":"cvs","pts":4,"q":"Anatomical Structures of the Heart Drag and drop each label to correctly identify the structures in the image below.","imgs":["HS2IMG-51c09599b22c92d8.png"],"qh":"<p><strong>Anatomical Structures of the Heart</strong></p> <p>Drag and drop each label to correctly identify the structures in the image below.</p> <p>[[IMG:HS2IMG-51c09599b22c92d8.png]]</p>","qt":"Anatomical Structures of the Heart Drag and drop each label to correctly identify the structures in the image below.","type":"match","pairs":[{"left":"5","right":"Pulmonary Semilunar Valve"},{"left":"4","right":"Tricuspid Valve"},{"left":"Flaps above 9","right":"Aortic Semilunar Valves"},{"left":"12","right":"Mitral Valve"}],"vid":{"id":"XyxuzHX1Grg","t":"Heart Sounds & Surface Anatomy | Cardiology","d":"6:04","at":152}},{"id":"q285888e6a5","quiz":"211012","sys":"cvs","pts":3,"q":"Examine the figure above of the pulmonary and systemic circulations. Describe the structural and functional differences between the two circulations. THREE obvious misconceptions are present in these answers. Find them and give the correct answers to rectify the misconceptions. ANSWER WITH MISCONCEPTIONS The pulmonary system connects and delivers oxygenated blood to the lungs and returns deoxygenated blood to the heart. The systemic circuit delivers oxygenated blood to the body for the purpose of cellular activity and drains deoxygenated blood from the lungs and from the rest of the body . The lung tissue gets oxygen from the pulmonary system.","imgs":["HS2IMG-6a1aa0b15b58b4b3.png"],"qh":"<p>[[IMG:HS2IMG-6a1aa0b15b58b4b3.png]]</p> <p>Examine the figure above of the pulmonary and systemic circulations. Describe the structural and functional differences between the two circulations.</p> <p><strong>THREE</strong> obvious misconceptions are present in these answers. Find them and give the correct answers to rectify the misconceptions.</p> <p>ANSWER WITH MISCONCEPTIONS</p> <p>The pulmonary system connects and delivers oxygenated blood to the lungs and returns deoxygenated blood to the heart.</p> <p>The systemic circuit delivers oxygenated blood to the body for the purpose of cellular activity and drains deoxygenated blood from the lungs and from the rest of the body.</p> <p>The lung tissue gets oxygen from the pulmonary system.</p>","qt":"Examine the figure above of the pulmonary and systemic circulations. Describe the structural and functional differences between the two circulations. THREE obvious misconceptions are present in these answers. Find them and give the correct answers to rectify the misconceptions. ANSWER WITH MISCONCEPTIONS The pulmonary system connects and delivers oxygenated blood to the lungs and returns deoxygenated blood to the heart. The systemic circuit delivers oxygenated blood to the body for the purpose of cellular activity and drains deoxygenated blood from the lungs and from the rest of the body. The lung tissue gets oxygen from the pulmonary system.","type":"essay","saq":{"steps":["Misconception 1: the pulmonary system does not \"deliver oxygenated blood to the lungs\" — it connects and delivers blood to and from the lungs FOR oxygenation.","Misconception 2: the systemic circuit does not \"drain deoxygenated blood from the lungs\" — it delivers blood to and from the rest of the body for the purpose of cellular activity.","Misconception 3: \"the lung tissue gets oxygen from the pulmonary system\" is wrong — the bronchial artery delivers oxygenated blood to the lung tissue and the bronchial vein returns the deoxygenated blood to the heart."],"src":"Her own answer · her feedback comment on this question"},"vid":{"id":"1z9oAe6nn3o","t":"Parts of the Cardiovascular System","d":"6:05","at":50,"alt":{"id":"AtsTfVpXDpY","t":"Blood Flow Through The Heart | In 2 mins!","d":"2:59","at":33}}},{"id":"q7e050a0e92","quiz":"211012","sys":"cvs","pts":3,"q":"Go through the following answer to the question below: Describe the components of the heart's conduction system and give its purpose. What two misconceptions can you find in the answer below? Correct them. ANSWER WITH MISCONCEPTIONS The conduction system is made up of the neuromuscular junctions at the SA and AV nodes, from which Bundle of His, and the Bundle branches reach the Purkinje fibres, as well as the conductive myocardium, the heart muscle. The point of the system is to spread electrical activity coming from the medulla oblongata via the nerves through the heart muscle in a coordinated way, to ensure correct and efficient contraction of the heart.","imgs":[],"qh":"<p>Go through the following answer to the question below:</p> <p><strong>Describe the components of the heart's conduction system and give its purpose. </strong></p> <p><strong>What two misconceptions can you find in the answer below? Correct them. </strong></p> <p>ANSWER WITH MISCONCEPTIONS</p> <p>The conduction system is made up of the neuromuscular junctions at the SA and AV nodes, from which Bundle of His, and the Bundle branches reach the Purkinje fibres, as well as the conductive myocardium, the heart muscle.</p> <p>The point of the system is to spread electrical activity coming from the medulla oblongata via the nerves through the heart muscle in a coordinated way, to ensure correct and efficient contraction of the heart.</p>","qt":"Go through the following answer to the question below: Describe the components of the heart's conduction system and give its purpose. What two misconceptions can you find in the answer below? Correct them. ANSWER WITH MISCONCEPTIONS The conduction system is made up of the neuromuscular junctions at the SA and AV nodes, from which Bundle of His, and the Bundle branches reach the Purkinje fibres, as well as the conductive myocardium, the heart muscle. The point of the system is to spread electrical activity coming from the medulla oblongata via the nerves through the heart muscle in a coordinated way, to ensure correct and efficient contraction of the heart.","type":"essay","saq":{"steps":["Misconception 1: the SA and AV nodes are pacemakers, not neuromuscular junctions — self-excitatory, autogenic myocardial tissue generating the heart rhythm; the heart can beat on its own without nervous stimulation or brain involvement.","Misconception 2: the electrical activity does not come from the medulla oblongata via nerves — it is generated by the SA and AV nodes themselves.","Correct answer: the conduction system is the SA and AV nodes, Bundle of His, bundle branches and Purkinje fibres, plus the conductive myocardium; its point is to spread electrical activity through the heart muscle in a coordinated way, for correct and efficient contraction."],"src":"Her own answer · her feedback comment on this question"},"vid":{"id":"1OEwneDW6A0","t":"Cardiac Arrhythmias Explained Impulse Formation vs Impulse Conduction ","d":"19:17","at":89},"ref":{"t":"Bundle of HIS (0.5)only place where electrical impulses cross from the top of the heart to the lower chambers(0.5) L & R Bundle branches (0.5)located in the septum (0.5) Purkinje fibres (0.5) (glycogen-rich cells with extensive gap junctions to transmit electrical signals to the myocardium (muscle cells of the ventricles) (0. "left":"1. Depolarisation","right":"Correct"},{"left":"2. Repolarisation","right":"Correct"},{"left":"3. Ventricular","right":"Heart"},{"left":"4.contraction","right":"Correct"},{"left":"5. Relaxation","right":"Correct"}],"vid":{"id":"791ZsLSmCjo","t":"Cardiovascular | ECG's","d":"20:37","at":198,"ch":"nn"},"ref":{"t":"14 Electrocardiogram (ECG) P- wave – atrial depolarisation (electrical excitation) causes contraction QRS- complex – ventricular depolarisation causes contraction T -wave – ventricular re polarisation (electrical inactivation) causes relaxation A normal ECG with U-wave Patton: FIGURE 28-17 The U wave. This electrocardiogram (ECG) recording shows the presence of a U wave, which follows the T wave—or appears as a “hump","src":"2026 Cardiovascular 3A-1 deck · slide 14"}},{"id":"q96fe2966b0","quiz":"211012","sys":"cvs","pts":5,"q":"Electrocardiogram Label the ECG recording below.","imgs":["HS2IMG-18dc0efe3c2fac52.png"],"qh":"<p><strong>Electrocardiogram</strong></p> <p>Label the ECG recording below.</p> <p>[[IMG:HS2IMG-18dc0efe3c2fac52.png]]</p>","qt":"Electrocardiogram Label the ECG recording below.","type":"match","pairs":[{"left":"A","right":"P wave"},{"left":"B","right":"Q"},{"left":"C","right":"R"},{"left":"D","right":"S"},{"left":"E","right":"T wave"}],"vid":{"id":"uXo62h96zgM","t":"ECGs (EKGs) Made Easy!","d":"3:56","at":125}},{"id":"q81fd72b9f6","quiz":"211012","sys":"cvs","pts":4,"q":"Explain what the following waves of the ECG represent: P wave QRS complex T wave One of the underlined terms in this answer is wrong . Find the error and replace it with a correct one in the matching exercise. Answer: P wave shows atrial 1.repolarisation - this causes the atria to contract. QRS complex shows 2. ventricular depolarisation - this causes the ventricles to contract. (The atria are repolarising and 3. relaxing at the same time, but in the background) T wave shows 4. ventricular repolarisation - this causes the ventricles to relax.","imgs":[],"qh":"<p>Exp  with U-wave Patton: FIGURE 28-17 The U wave. This electrocardiogram (ECG) recording shows the presence of a U wave, which follows the T wave—or appears as a “hump","src":"2026 Cardiovascular 3A-1 deck · slide 14"}},{"id":"q8118ef6216","quiz":"211012","sys":"cvs","pts":1,"q":"What are some of the changes to the heart you can detect by examining an ECG? Mark all that do NOT apply.","imgs":[],"qh":"<p>What are some of the changes to the heart you can detect by examining an ECG?</p> <p><strong>Mark all that do NOT apply. </strong></p>","qt":"What are some of the changes to the heart you can detect by examining an ECG? Mark all that do NOT apply.","type":"multi","opts":["Tachycardia - more than 100b/m","Blood pressure","Arrhythmia","STEMI - myocardium totally deprived of oxygen","NSTEMI - myocardium partially deprived of oxygen.","Bradycardia - less than 60b/m","Peripheral resistance","Stroke volume"],"key":["Blood pressure","Peripheral resistance","Stroke volume"],"ref":{"t":"BIG FORMULAE OF HEART FUNCTION CO = SV x HR CO =Cardiac output = blood delivered by heart per minute SV =Stroke volume= blood delivered by heart per beat HR =Heart rate = beats per minute BP = CO x PR CO =Cardiac output = blood delivered by heart per minute BP = Blood pressure in mmHg – Pressure of blood against arterial walls PR = Peripheral Resistance = push back from blood vessels to blood coming into them BP = SV","src":"2026 Cardiovascular system 2-3 deck · slide 34"}},{"id":"qe46e785a53","quiz":"211012","sys":"cvs","pts":7,"q":"What is a coronary angiogram and what is the purpose of this procedure? TWO obvious misconceptions can be found in the bold printed words in this answer. Find them and replace them with the correct answer by doing the following matching exercise. It is a procedure that allows us to see the carotid arteries to check for narrowing or ischemia . Often angioplasty, thrombolysis and/or insertion of a stent may be done during this procedure.","imgs":[],"qh":"<p>What is a <s s are too thick fo anyone to feel the pulsation","The veins don't have clear elastic laminae","The walls of the veins are too thin","It is separated from the pump action of theheart by the capillary bed"],"key":["It is separated from the pump action of theheart by the capillary bed"],"ref":{"t":"Smaller arteries are called arterioles. VEINS The letters refer to the first micrograph. Veins are low pressure blood vessels returning blood to the heart. Bleeding from a vein would flow smoothly. There is no pump action behind it. The capillary beds and the many valves smooth out the flow.","src":"CVS 1 learning page"}},{"id":"qf09dfbd945","quiz":"211012","sys":"cvs","pts":3,"q":"Describe the difference in normal BP (mean) in the arteries, arterioles, capillaries and venae cavae? Explain why this happens. You may wish to refer to your Human Anatomy & Physiology textbook CHAPTER 29: Blood circulations in Patton and Thibodeau","imgs":[],"qh":"<p>Describe the difference in normal BP (mean) in the arteries, arterioles, capillaries and venae cavae? Explain why this happens.</p> <p>You may wish to refer to your Human Anatomy &amp; Physiology textbook</p> <ul><li><a href=\"https://www.clinicalkey.com/student/nursing/content/book/3-s2.0-B9780702078606000420#hl0002295\" target=\"_blank\" rel=\"noopener\">CHAPTER 29: Blood circulations in Patton and Thibodeau</a></li></ul>","qt":"Describe the difference in normal BP (mean) in the arteries, arterioles, capillaries and venae cavae? Explain why this happens. You may wish to refer to your Human Anatomy & Physiology textbook CHAPTER 29: Blood circulations in Patton and Thibodeau","type":"essay","saq":{"steps":["Arteries = very high; arterioles = high; capillaries = gradually decrease but low overall; venae cavae = low.","BP depends on the contraction force of the heart and the peripheral resistance: arteries receive blood directly from the heart, and pressure falls as blood passes through the capillary beds, after which the veins receive it.","Arterial walls also offer the greatest resistance against the pumping force of the heart because of their thick tunica media."],"src":"Her own answer · her feedback comment on this question"},"ref":{"t":"Cardio = Vasculature = Pump = Heart to circulate blood- keeps it moving – TWO PUMPS = Arteries = Veins Pipes = Blood vessels to transport the blood = Capillaries take blood Away from heart –high pressure-thick wall return blood to heart – lower pressure -thinner wall connect arteries & veins –very thin walls - exchange COMPONENTS OF THE CVS 3 1 2 3","src":"2026 CIRCULATION VESSELS CV1-1 deck · slide 4"}},{"id":"q92e47364d1","quiz":"211012","sys":"cvs","pts":5,"q":"Reflect on the processes of filtration and absorption. Describe the forces acting across a blood capillary, at both the arteriolar and the venular end. You may wish to refer to your Human Anatomy & Physiology textbook CHAPTER 29: Blood circulations in Patton and Thibodeau The answer below contains one error in the underlined parts. Find the error and replace it with an alternative that would make the definitions correct. ANSWER Arterial side: high hydrostatic pressure because of pump action of heart, 1. favors filtration. Forces fluid from bloodvessel into 2.intestinum . Venous side: high 3.oncotic pressure because of higher osmotic pressure in bloodvessel with all the water that left leaving 4. proteins and cells behind, 5. favors reabsorption . Forces fluid from interstitium back into capillary.","imgs":[],"qh":"<p>Reflect on the processes of filtration and absorption. Describe the forces acting across a blood capillary, at both the arteriolar and the venular end.</p> <p>You may wish to refer to your Human Anatomy &amp; Physiology textbook</p> <ul><li><a href=\"https://www.clinicalkey.com/student/nursing/content/book/3-s2.0-B9780702078606000420#hl0002295\" target=\"_blank\" rel=\"noopener\">CHAPTER 29: Blood circulations in Patton and Thibodeau</a></li></ul> <p>The answer below contains <strong>on uid movement in the following conditions and why: Hypertension Dehydration Hypoalbuminaemia The answer below contains one error in the underlined parts. Find the error and replace it with an alternative that would make the definitions correct. ANSWER WITH ERROR Hypertension Higher hydrostatic pressure on arterial sides of capillary beds will 1.force more fluid out into the interstitium Dehydration Lower blood volume--> 2.Lower hydrostatic pressure on arterial sides of capillary beds will force 3. less fluid out into the interstitium Hypoalbuminaemia 4. Higher Oncotic pressure due to low protein levels on venous sides of capillary beds will lead to 5.lower reabsorption from interstitium leading to edema.","type":"match","pairs":[{"left":"1.force more fluid out","right":"Correct"},{"left":"2.Lower hydrostatic pressure","right":"Correct"},{"left":"3. less fluid out in","right":"Correct"},{"left":"4. Higher Oncotic pressure","right":"Lower Oncotic pressure"}],"vid":{"id":"nJ44wZ5_TvA","t":"Oedema (Edema) | Capillary Exchange, Causes, and Pathophysiology","d":"24:29","at":1082},"ref":{"t":"Can you explain what is meant by the terms arterial, venous, systemic, pulmonary, coronary? (We will do this in lecture CVS2 as well). Can you explain the forces that help to push fluids (and nutrients) OUT into the tissues, and the forces that help sucks fluids (and wastes) BACK into the blood stream? (This is the phenomenon of fluid dynamics).","src":"CVS 1 learning page"}},{"id":"q9a9c2b34f0","quiz":"211012","sys":"cvs","pts":5,"q":"Describe the body’s neural mechanisms for regulating blood pressure. The answer below contains two errors in the underlined parts. Find the errors and, in the matching exercise, replace them with alternatives that would make the definitions correct. ANSWER WITH ERRORS BP=HR x SV x PR Neural : 1. Chemoreceptors in 2.aortic & carotid bodies sense change in blood pressure. Signals sent to cardiac and vasomotor centres in 3.medulla oblongata from where the following centres are stimulated/ inhibited: a) Vasomotor centre to 4.dilate/constrict bloodvessels affecting PR; b) Cardiac centres (acceleratory centre (inhibit/stimulate) and inhibitory centre (inhibit/stimulate) having both a chronotropic and inotropic effect affecting 5.HR and SV .","imgs":[],"qh":"<p>Describe the body’s neural mechanisms for regulating blood pressure.</p> <p>The answer below contains <strong>two</strong><strong> errors </strong>in the underlined parts. Find the errors and, in the matching exercise, replace them with alternatives that would make the definitions correct.</p> <p>ANSWER WITH ERRORS</p> <p><strong>BP=HR x SV x PR </strong></p> <p><strong>Neural</strong>:</p> <p><strong>1. Chemoreceptors</strong> in <strong>2.aortic &amp; carotid bodies </strong>sense change in blood pressure.</p> <p>Signals sent to cardiac and vasomotor centres in <strong>3.medulla oblongata </strong>from where the following centres are stimulated/ inhibited:</p> <p><strong>a) Vasomotor centre </strong>to <strong>4.dilate/constrict bloodvessels </strong>affecting <strong>PR;</strong></p> <p>b) <strong>Cardiac centres</strong> (acceleratory centre (inhibit/stimulate) and inhibitory centre (inhibit/stimulate) having both a chronotropic and inotropic effect affecting <strong>5.HR and SV. </strong></p>","qt":"Describe the body’s neural mechanisms for regulating blood pressure. The answer below contains two errors in the underlined parts. Find the errors and, in the matching exercise, replace them with alternatives that would make the definitions correct. ANSWER WITH ERRORS BP=HR x SV x PR Neural: 1. Chemoreceptors in 2.aortic & carotid bodies sense change in blood pressure. Signals sent to cardiac and vasomotor centres in 3.medulla oblongata from where the following centres are stimulated/ inhibited: a) Vasomotor centre to 4.dilate/constrict bloodvessels affecting PR; b) Cardiac centres (acceleratory centre (inhibit/stimulate) and inhibitory centre (inhibit/stimulate) having both a chronotropic and inotropic effect affecting 5.HR and SV.","type":"match","pairs":[{"left":"1.Chemoreceptors","right":"Baro receptors"},{"left":"2.aortic arch & carotid bodies","right":"aortic arch & carotid sinus"},{"left":"3.medulla oblongata","right":"Correct"},{"left":"4.dilate/constrict boodvessels","right":"Correct"},{"left":"BP=HR x SV x PR","right":"Correct"}],"vid":{"id":"vLSwWBRWekY","t":"AMA | RAAS & Blood Pressure, Bone Cells, GFR, Mechanism of SSRIs, Adap","d":"91:48","at":5322},"ref":{"t":"Patton: FIGURE 30-14 Vasomotor pressoreflexes (BAROREFLEXES). RECEPTORS: Carotid sinus and aortic baroreceptors detect changes in blood pressure and feed the information back to the INTEGRATION: cardiac control centre and the vasomotor centre in the medulla. These control centres alter the ratio between sympathetic and parasympathetic output.","src":"CVS 4 learning page"}},{"id":"qac09650676","quiz":"211012","sys":"cvs","pts":6,"q":"Describe the direct renal control of BP. The are two errors in the underlined numbered answers given below. Find them and correct them by choosing the correct pairs in the matching exercise. Low BP 1.Reduced blood flow to the kidney leads to 2. increased filtration leads to reduced urine output increasing blood volume leading to 3.reduced SV to increase BP. High BP 4.Increased blood flow to kidney leads to increased filtration leads to 5. Increased urine output reducing blood volume. Reduced blood volume leads to 6.decreased SV bringing BP down.","imgs":[],"qh":"<p>Describe the direct renal control of BP.</p> <p>The are two errors in the underlined numbered answers given below. Find them and correct them by choosing the correct pairs in the matching exercise.</p> <p><strong>Low BP</strong></p> <p><strong>1.Reduced</strong> blood flow to the kidney leads to <strong>2. increased filtration</strong> leads to reduced urine output increasing blood volume leading to <strong>3.reduced SV</strong> to increase BP.</p> <p><strong>High BP</strong></p> <p><strong>4.Increased blood </strong>flow to kidney leads to increased filtration leads to<strong> 5. Increased urine output</strong> reducing blood volume.</p> <p>Reduced blood volume leads to <strong>6.decreased SV</strong> bringing BP down.</p>","qt":"Describe the direct renal control of BP. The are two errors in the underlined numbered answers given below. Find them and correct them by choosing the correct pairs in the matching exercise. Low BP 1.Reduced blood flow to the kidney leads to 2. increased filtration leads to reduced urine output increasing blood volume leading to 3.reduced SV to increase BP. High BP 4.Increased blood flow to kidney leads to increased filtration leads to 5. Increased urine output reducing blood volume. Reduced blood volume leads to 6.decreased SV bringing BP down.","type":"match","pairs":[{"left":"1.Reduced","right":"Correct"},{"left":"2 increased filtration","right":"reduced filtration"},{"left":"3. reduced SV","right":"Increased SV"},{"left":"4.Increased blood","right":"Correct"},{"left":"5. Increased urine output","right":"Correct"},{"left":"6.decreased SV","right":"Correct"}],"ref":{"t":"18 Vasomotor pressoreflexes Pressure too high increased parasympathetic impulses & reduced sympathetic impulses slow HR reduce SV Decrease PR by dilating blood “reservoir” vessels. Pressure too low increase sympathetic impulses increasing HR increase SV Increase PR by constricting arterioles & reservoir vessels. Carotid sinus & aortic baroreceptors detect changes in blood pressure Inform Cardiac control centre & the ","src":"2026 Cardiovascular System 4-2 deck · slide 18"}},{"id":"qe534856e4d","quiz":"211012","sys":"cvs","pts":5,"q":"Describe the role of the renin-angiotensin-aldosterone pathway and the ACE inhibitors that modify this pathway. NB: You will need to be very familiar with the renin-angiotensin-aldosterone pathway in order to provide rationale for your nursing interventions in clinical practice.","imgs":[],"qh":"<p>Describe the role of the renin-angiotensin-aldosterone pathway and the ACE inhibitors that modify this pathway.</p> <p><strong>NB: You will need to be very familiar with the renin-angiotensin-aldosterone pathway in order to provide rationale for your nursing interventions in clinical practice.</strong></p>","qt":"Describe the role of the renin-angiotensin-aldosterone pathway and the ACE inhibitors that modify this pathway. NB: You will need to be very familiar with the renin-angiotensin-aldosterone pathway in order to provide rationale for your nursing interventions in clinical practice.","type":"essay","saq":{"steps":["RAAS is a powerful but slow renal response to LOW blood pressure.","It stimulates the formation of angiotensin II — a powerful vasoconstrictor, so peripheral resistance rises.","It stimulates fluid retention — ADH release (water retention) and aldosterone release (sodium, therefore fluid, retention) — so blood volume and stroke volume rise, and BP rises.","ACE inhibitors block the conversion of angiotensin I to angiotensin II, so they prevent both the fall in vessel diameter (the PR rise) and the rise in blood volume (the SV rise).","BP = SV × PR × HR: by acting on two of the three factors, ACE inhibitors are powerful antihypertensives."],"src":"Her own answer · her feedback comment on this question"},"vid":{"id":"nh08D29jepg","t":"Hypertension & Anti-Hypertensive Drugs","d":"24:58","at":1028},"ref":{"t":"16 Short term Neural- mainly alter HR & PR Long-term Baroreceptor-initiated reflexes Faster Indirect: Slow but powerful RAAS Enzyme Renin converts angiotensinogen to Angiotensin I converted by ACE  Angiotensin II Vasoconstriction, Stimulates secretion of Aldosterone (Na + retention) & ADH (H 2 O retention) Renal - mainly alter blood volume Direct: Lower BP  lower blood flow to kidney  lower filtration rate  lower","src":"2026 Cardiovascular System 4-2 deck · slide 16"}},{"id":"q44e580932a","quiz":"211012","sys":"cvs","pts":7,"q":"Do the matching ex ors 1.1 Effect of arterial Pco 2 High carbon dioxide P CO2 ( hypercapnoea ) levels in the blood excites the inspiratory centre and increase the rate and depth of breathing, this blows off the excess CO 2 , reducing blood P CO2 Hypocapnoea ( low carbon dioxide P CO2 levels in the blood) I nhibits breathing  becomes slow and shallow. Periods of apnea may occur","src":"2019 S2 Resp 4-1 deck · slide 22"}},{"id":"qf0544fd158","quiz":"211019","sys":"lymph","pts":1,"q":"A patient has the following arterial blood gas results: pH 7.52; Pa co 2 30 mmHg (4 kPa); HCO 3 – 24 mmol/L. The nurse determines that these results indicate:","imgs":[],"qh":"<p>A patient has the following arterial blood gas results: pH 7.52; Paco2 30 mmHg (4 kPa); HCO3– 24 mmol/L. The nurse determines that these results indicate:</p>","qt":"A patient has the following arterial blood gas results: pH 7.52; Paco2 30 mmHg (4 kPa); HCO3– 24 mmol/L. The nurse determines that these results indicate:","type":"mcq","opts":["metabolic acidosis","metabolic alkalosis","respiratory alkalosis","respiratory acidosis"],"key":["metabolic alkalosis"],"ref":{"t":"Arterial Blood Gas Analysis Note pH - determine acidosis or alkalosis 2 . Study P CO2 If pH and P CO2 changes move in: - opposite directions – respiratory imbalance - same direction – respiratory system is compensating 3. Study HCO 3 - If pH and HCO 3 - changes move in: - same direction – metabolic imbalance - opposite directions – renal system is compensating No change in pH - the imbalance is fully compensated","src":"2026 RESP 3 deck · slide 34"}},{"id":"q78d6edb058","quiz":"211019","sys":"lymph","pts":1,"q":"The typical fluid replacement for the patient with an intracellular fluid volume deficit is:","imgs":[],"qh":"<p>The typical fluid replacement for the patient with an intracellular fluid volume deficit is:</p>","qt":"The typical fluid replacement for the patient with an intracellular fluid volume deficit is:","type":"mcq","opts":["hypotonic","hypertonic","isotonic","a plasma expander"],"key":["isotonic"]},{"id":"qf58159da60","quiz":"211019","sys":"lymph","pts":2,"q":"Explain why a kwashiorkor, a condition caused by a diet deficient in protein, is characterized by a distended abdomen due to edema.","imgs":[],"qh":"<p>Explain why a kwashiorkor, a condition caused by a diet deficient in protein, is characterized by a distended abdomen due to edema.</p>","qt":"Explain why a kwashiorkor, a condition caused by a diet deficient in protein, is characterized by a distended abdomen due to edema.","type":"essay","saq":{"steps":["Low protein in the diet means low protein in the blood plasma.","Plasma proteins (albumin) are what pull fluid back in, so oncotic pressure at the venous end of the capillaries falls → less reabsorption → fluid builds up in the interstitium: oedema, in the abdomen a distended belly."],"src":"Her own answer · her feedback comment on this question"},"vid":{"id":"nJ44wZ5_TvA","t":"Oedema (Edema) | Capillary Exchange, Causes, and Pathophysiology","d":"24:29","at":1078},"ref":{"t":"This is so because of the high oncotic pressure, due to the highconcentration of colloids, (such as proteins) in the blood vessel. Because of the prior outflow of fluid, the blood on the venous side is more \"concentrated\" drawing the fluid back in.","src":"CVS 1 learning page"}},{"id":"q7b2d2301d1","quiz":"211019","sys":"lymph","pts":2,"q":"Explain the link between hypertension and edema.","imgs":[],"qh":"<p>Explain the link between hypertension and edema.</p>","qt":"Explain the link between hypertension and edema.","type":"essay","saq":{"steps":["High blood pressure means high hydrostatic pressure at the arterial end of the capillaries, which forces more fluid out into the interstitium.","That overwhelms the drainage system (venous reabsorption plus the lymphatics), so fluid accumulates in the tissues: oedema."],"src":"Her own answer · her feedback comment on this question"},"vid":{"id":"SOZhlKj7nZ0","t":"Heart Failure in under 2 mins!","d":"1:38","at":69},"ref":{"t":"Can you explain what is meant by the terms arterial, venous, systemic, pulmonary, coronary? (We will do this in lecture CVS2 as well). Can you explain the forces that help to push fluids (and nutrients) OUT into the tissues, and the forces that help sucks fluids (and wastes) BACK into the blood stream? (This is the phenomenon of fluid dynamics).","src":"CVS 1 learning page"}},{"id":"q67bd4e2ade","quiz":"211021","sys":"cvs","pts":0.5,"q":"What is the vein labelled A","imgs":["HS2IMG-4f9225661a626825.jpg"],"qh":"<p>[[IMG:HS2IMG-4f9225661a626825.jpg]]</p> <p>What is the vein labelled A</p>","qt":"What is the vein labelled A","type":"mcq","opts":["Brachial vein","Axillary vein","Brachiocephalic vein","Subclavian vein"],"key":["Subclavian vein"],"ref":{"t":"Containing lymph nodes located at certain intervals along their course. Collect fluids draining from tissues of the body (lymph) and return it to the blood circulation Lymphatic ducts Large lymphatic vessels formed by many tributaries throughout the body; connect to the subclavian veins (Patton FIGURE 31-3 Lymphatic drainage). Right lymphatic duct drains into right subclavian vein.","src":"Lymphatic System learning page"}},{"id":"qfdf9b65848","quiz":"211021","sys":"cvs","pts":0.5,"q":"What is the structure being held by the foreceps in this photo?","imgs":["HS2IMG-fdbbad844b74f97d.jpg"],"qh":"<p>[[IMG:HS2IMG-fdbbad844b74f97d.jpg]]</p> <p>What is the structure being held by the foreceps in this photo?</p>","qt":"What is the structure being held by the foreceps in this photo?","type":"mcq","opts":["visceral pleura","parietal pericardium","visceral pericardium","parietal pleura"],"key":["visceral pericardium"]},{"id":"q8991ce12e6","quiz":"211021","sys":"cvs","pts":2,"q":"What is the white tissue seen on in the heart in this image [ Select ] What is its function? [ Select ]","imgs":["HS2IMG-fdbbad844b74f97d.jpg"],"qh":"<p>[[IMG:HS2IMG-fdbbad844b74f97d.jpg]]</p> <p>What is the whit tibial and dorsalis pedis pulse sites)."],"src":"Her own answer · her feedback comment and the limb-arteries diagram she posted on it"},"ref":{"t":"aortic arch descending aorta brachiocephalic artery subclavian artery carotid artery brachial artery radial artery external iliac artery femoral artery hepatic artery anterior tibial artery renal artery 1 2 3 Brachiocephalic artery 4 R Subclavian artery 5 R Carotid artery 6 Brachial artery 7 Radial artery 8 External Iliac A 9 Femoral A 10 Hepatic A 12 Renal A AWAY from the heart Ascending aorta Ulnar artery Axillary ","src":"2026 CIRCULATION VESSELS CV1-1 deck · slide 29"}},{"id":"q4e104b68f9","quiz":"211021","sys":"cvs","pts":4,"q":"Name four veins that directly empty into the inferior vena cava and the organs they drain. The ______________________________ vein from the legs, the gonadal veins, the suprarenal veins, the renal veins and the _________________________veins from the liver","imgs":[],"qh":"<p>Name <u>four </u>veins that directly empty into the inferior vena cava and the organs they drain.</p> <p>The ______________________________ vein from the legs, the gonadal veins, the suprarenal veins, the renal veins and the _________________________veins from the liver</p>","qt":"Name four veins that directly empty into the inferior vena cava and the organs they drain. The ______________________________ vein from the legs, the gonadal veins, the suprarenal veins, the renal veins and the _________________________veins from the liver","type":"essay","saq":{"steps":["Common iliac veins — the legs and pelvis.","Renal veins — the kidneys; suprarenal veins — the adrenal glands.","Gonadal veins — the ovaries/testes.","Hepatic veins — the liver (carrying everything the hepatic portal vein brought in)."],"src":"Her own answer · her feedback comment on this question"},"ref":{"t":"Label as many as you can superior vena cava inferior vena cava external iliac vein femoral vein renal vein great saphenous vein anterior tibial vein L & R brachiocephalic veins jugular vein subclavian vein axillary vein brachial vein hepatic vein hepatic portal vein FIGURE 29-15 Principal veins of the body.","src":"2026 Cardiovascular system 2-2 deck · slide 5"}},{"id":"qd576bd0933","quiz":"211021","sys":"cvs","pts":3,"q":"Use the histological images and diagrams provided on CANVAS to draw diagrams of an artery and a vein. Label clearly to show the differences (structural) between them, and the three layers in their walls, included notes on the functional differences too.","imgs":["HS2IMG-e6ae3820cf768f36.jpg"],"qh":"<p>Use the histological images and diagrams provided on CANVAS to draw diagrams of an artery and a vein. <u>Label clearly</u> to show the <u>differences (structural)</u> between them, and the three layers in their walls, included notes on the functional differences too.</p>","qt":"Use the histological images and diagrams provided on CANVAS to draw diagrams of an artery and a vein. Label clearly to show the differences (structural) between them, and the three layers in their walls, included notes on the functional differences too.","type":"essay","saq":{"steps":["Both walls have three layers: tunica intima (endothelium), tunica media (smooth muscle ± elastic fibres), tunica adventitia/externa (connective tissue).","Artery: smaller round lumen, stiff appearance, THICK tunica media, clear internal (and external) elastic lamina, thin externa — it takes the pumping force of the heart and, in the arterioles, sets peripheral resistance.","Vein: larger floppy lumen, THIN media, thick externa, elastic lamina not clear, valves — veins come after the capillary beds so the heart’s pumping force is not transferred to them; muscle and breathing push the blood."],"src":"Her own answer · her artery-vs-vein table on the CVS Review quiz and the labelled histology image she posted"},"vid":{"id":"moMNBucCew8","t":"Cardiovascular | Tunic Layers & Types of Capillaries","d":"22:04","at":587,"ch":"nn"}},{"id":"qf3c3c8b48f","quiz":"211021","sys":"cvs","pts":2,"q":"What is the fibrous material on the outside of the heart called? What is its function?","imgs":[],"qh":"<p>What is the fibrous material on the outside of the heart called? What is its function?</p>","qt":"What is the fibrous material on the outside of the heart called? What is its function?","type":"essay","saq":{"steps":["The pericardium — actually two layers: a thick, obvious outer fibrous layer, and a thin layer that covers the heart surface.","Together they prevent friction, thanks to the pericardial fluid, and the thick outer layer prevents overfilling by giving the heart a maximum size it can stretch to."],"src":"Her own answer · her feedback comment on this question"},"vid":{"id":"uKrgEv7-rVM","t":"Parts of the Cardiac System (Heart Anatomy)","d":"7:57","at":58},"ref":{"t":"Coverings of the heart Superficial: Fibrous Parietal pericardium Deeper : Serous Parietal Pericardium Pericardial Fluid in pericardial space Deep: Visceral pericardium = epicardium  ","src":"2026 Cardiovascular system 2-2 deck · slide 7"}},{"id":"qb1c9f7e292","quiz":"211021","sys":"cvs","pts":2,"q":"Why can you feel a pulse in an artery but not a vein?","imgs":[],"qh":"<p>Why can you feel a pulse in an artery but <u>not</u> a vein?</p>","qt":"Why can you feel a pulse in an artery but not a vein?","type":"essay","saq":{"steps":["The pulse is a wave of movement in the artery walls made by the pulsatile, \"squirty\" flow of blood from the heart.","The wave is not strong enough to travel through the capillary beds to the veins — it is the muscular effort of the body (and breathing), not the heart’s pumping, that pushes blood through veins."],"src":"Her own answer · her feedback comment on this question"},"ref":{"t":"Smaller arteries are called arterioles. VEINS The letters refer to the first micrograph. Veins are low pressure blood vessels returning blood to the heart. Bleeding from a vein would flow smoothly. There is no pump action behind it. The capillary beds and the many valves smooth out the flow.","src":"CVS 1 learning page"}},{"id":"q8f379a7fe0","quiz":"211021","sys":"cvs","pts":2,"q":"What types of abnormalities can an ECG detect? Give two examples of the abnormalities.","imgs":[],"qh":"<p>What types of abnormalities can an ECG detect? Give two examples of the abnormalities.</p>","qt":"What types of abnormalities can an ECG detect? Give two examples of the abnormalities.","type":"essay","saq":{"steps":["Only anomalies caused by changes in the heart’s ELECTRICAL activity: conduction, rate and rhythm.","Examples: rate — tachycardia (>100 b/min) or bradycardia (<60); rhythm — regular vs irregular, atrial or ventricular fibrillation; blocks and other conduction-system faults; type of myocardial infarction — STEMI (total coronary occlusion) vs NSTEMI (partial)."],"src":"Her own answer · her feedback comment on this question"},"vid":{"id":"zK2RIOqcuIU","t":"How to read an ECG / EKG","d":"3:29","at":171},"ref":{"t":"Uses of Electrocardiogram ECG detects changes in: Normal sinus rhythm Junctional rhythm Partial Heart block Ventricular fibrillation Heart Rate Tachy cardia (>100b/m) Brady cardia (<60 b/m) Heart rhythm – a rrhythmias Blood flow to the heart – e.g . ischemia, myocardial infarction, etc.","src":"2026 Cardiovascular 3A-1 deck · slide 18"}},{"id":"qe23369c6f9","quiz":"211021","sys":"cvs","pts":4,"q":"Discuss the heart rate changes that occur/would occur during the different ECG readings suggested during the lab. Discuss why these changes occur? Sitting, resting Supine, resting Immediately on standing Immediately after exercise and standing","imgs":[],"qh":"<p>Discuss the heart rate changes that occur/would occur during the different ECG readings suggested during the lab. Discuss why these changes occur?</p> <div class=\"tbl\"><div class=\"tr\"><div class=\"td\"><p>Sitting, resting</p></div></div> <div class=\"tr\"><div class=\"td\"><p>Supine, resting</p></div></div> <div class=\"tr\"><div class=\"td\"><p>Immediately on standing</p></div></div> <div class=\"tr\"><div class=\"td\"><p>Immediately after exercise and standing</p></div></div></div>","qt":"Discuss the heart rate changes that occur/would occur during the different ECG readings suggested during the lab. Discuss why these changes occur? Sitting, resting Supine, resting Immediately on standing Immediately after exercise and standing","type":"essay","saq":{"steps":["Sitting, resting — around your resting heart rate.","Supine, resting — lying down the heart does not have to pump against gravity up to the head, so it works less hard; rate can fall.","Immediately on standing — the heart suddenly has to fight gravity: a sharp rise in rate to keep the head perfused, settling back to normal.","Immediately after exercise, standing — still pumping hard and fast: the muscles must restore their energy stores and need extra oxygen for a while, so the rate returns to normal only slowly."],"src":"Her own answer · her feedback comment on this question"},"ref":{"t":"Hypotension BP = 90/60 mmHg Orthostatic hypotension Low blood pressure when standing after sitting or lying down Shock a life-threatening condition where blood pressure drops dangerously low Shock stages:  ","src":"CVS 4 learning page"}},{"id":"qa810a439f4","quiz":"211026","sys":"resp","pts":5,"q":"Difficulty in breathing. [ Select ] Presence of air in the pleural cavity. [ Select ] Collapse of the lung. [ Select ] Normal rate and depth of breathing. [ Select ] Bluish discoloration of the skin and mucous membrane. [ Select ]","imgs":[],"qh":"<p>Difficulty in breathing. [[BLANK:0]]</p> <p>Presence of air in the pleural cavity. [[BLANK:1]]</p> <p>Collapse of the lung. [[BLANK:2]]</p> <p>Normal rate and depth of breathing. [[BLANK:3]]</p> <p>Bluish discoloration of the skin and mucous membrane. [[BLANK:4]]</p>","qt":"Difficulty in breathing. ____ Presence of air in the pleural cavity. ____ Collapse of the lung. ____ Normal rate and depth of breathing. ____ Bluish di "qh":"<div><div><div><div><div>Two gases contribute to 99% of the total atmospheric pressure. They are ______</div></div></div></div></div>","qt":"Two gases contribute to 99% of the total atmospheric pressure. They are ______","type":"mcq","opts":["N2 and O2","CO2 and O2","CO2 and H2O vapor","N2 and CO2"],"key":["N2 and O2"],"vid":{"id":"7z9coEwzn2s","t":"Daltons Law | Partial Pressures","d":"7:05","at":198},"ref":{"t":"Gas laws Boyle’s law V = 1 / P a gas’s volume is inversely proportional to its pressure Dalton’s law the total pressure exerted by a mixture of gases is the sum of the pressure of each individual gas. P total = P 1 +P 2 +P 3 .. Henry’s law, A gas’s concentration in a solution depends on partial pressure of gas & solubility of gas, as long as temp remains constant. Gas concentration =P gas X solubility Atmospheric pre","src":"2026 RESP2 deck · slide 5"}},{"id":"q84719448cd","quiz":"211039","sys":"resp","pts":1,"q":"The pressure exerted by each gas in a mixture is proportional to its percentage. This is _______.","imgs":[],"qh":"<div><div><div><div><div>The pressure exerted by each gas in a mixture is proportional to its percentage. This is _______.</div></div></div></div></div>","qt":"The pressure exerted by each gas in a mixture is proportional to its percentage. This is _______.","type":"mcq","opts":["the law of gas proportionality","Boyle’s law of partial pressures","Henry’s law of gas percentages","Dalton’s law of partial pressures"],"key":["Dalton’s law of partial pressures"],"vid":{"id":"CQo_if4NEb4","t":"Dalton's Law and Henry's Law","d":"6:36","at":369,"alt":{"id":"7z9coEwzn2s","t":"Daltons Law | Partial Pressures","d":"7:05","at":15}},"ref":{"t":"Gas laws Boyle’s law a gas’s volume is inversely proportional to its pressure Dalton’s law the total pressure exerted by a mixture of gases is the sum of the pressure of each individual gas. Henry’s law, A gas’s concentration in a solution depends on the partial pressure of the gas and the solubility of the gas, as long as the temperature remains constant.","src":"2026 Resp 2-2 deck · slide 6"}},{"id":"qbe81316f91","quiz":"211039","sys":"resp","pts":1,"q":"Why is the rate of CO 2 exchange roughly equivalent to that of O 2 despite its less steep pressure gradient?","imgs":[],"qh":"<div><div><div><div><div>Why is the rate of CO2 exchange roughly equivalent to that of O2 despite its less steep pressure gradient?</div></div></div></div></div>","qt":"Why is the rate of CO2 exchange roughly equivalent to that of O2 despite its less steep pressure gradient?","type":"mcq","opts":["CO2 is more soluble in water than is O2.","CO2 binds to O2 and moves across the respiratory membrane simultaneously.","CO2 diffuses much more rapidly out of the cells","CO2 is actively transported into the alveoli."],"key":["CO2 is more soluble in water than is O2."],"vid":{"id":"9IZGNzj9S0w","t":"Diving Physiology | Respiratory System","d":"9:09","at":231,"alt":{"id":"nBfqDvNJ3LA","t":"Gas Exchange","d":"2:43","at":105}},"ref":{"t":"Factors influencing External Respiration (pulmonary gas exchange): 1 Partial Pressure Gradients & Gas Solubilities The higher the partial pressure gradient of a gas, greater will be its rate of diffusion across the respiratory membrane Although the partial pressure gradient of oxygen is 64 mm Hg and that of CO 2 is 5 mm Hg both gases diffuse in equal amounts across the respiratory membrane. Explain how?","src":"2026 Resp 2-2 deck · slide 24"}},{"id":"q2d57fdd503","quiz":"211039","sys":"resp","pts":1,"q":"External respiration is affected by all of the following factors except:","imgs":[],"qh":"<div><div><div><div><div>External respiration is affected by all of the following factors except:</div></div></div></div></div>","qt":"External respiration is affected by all of the following factors except:","type":"mcq","opts":["thickness of the respiratory membrane","partial pressure gradient of oxygen across the respiratory membrane","solubility of gases in fluids","Increased airway resistance"],"key":["Increased airway resistance"],"ref":{"t":"8. How different factors influence lung volumes and capacities Airway resistance Increased resistance (asthma, COPD): ↓ Forced expiratory volumes Air trapping increases residual volume Respiratory muscle strength Strong diaphragm & intercostal muscles → ↑ inspiratory & expiratory volumes Weaknes s (e.g. neuromuscular disease) → ↓ volumes Altitude and environment High altitude : Long-term ↑ lung volumes due to acclima","src":"2026 RESP 3 deck · slide 28"}},{"id":"q850dd958b9","quiz":"211039","sys":"resp","pts":1,"q":"The majority of carbon dioxide is transported:","imgs":[],"qh":"<div><div><div><div><div>The majority of carbon dioxide is transported:</div></div></div></div></div>","qt":"The majority of carbon dioxide is transported:","type":"mcq","opts":["dissolved in the plasma","as carbonic acid in the plasma","as bicarbonate in the plasma","as carbaminohaemoglobin in the plasma"],"key":["as bicarbonate in the plasma"],"vid":{"id":"6cb0eDBO19k","t":"Respiratory Acidosis & Alkalosis","d":"24:54","at":135,"alt":{"id":"8cOyDn2Myy8","t":"Buffers of the Body | Podcast","d":"95:59","at":4454}},"ref":{"t":"Both Carbon dioxide and Oxygen are carried dissolved in blood plasma. Carbon dioxide is much more soluble than oxygen in water. The majority of carbon dioxide is therefore carried either dissolved or in the form of bicarbonate in the blood. Oxygen is not very soluble in water so onlya small percentage is dissolved in the blood plasma.","src":"RESP 3 learning page"}},{"id":"q89bedfeb5a","quiz":"211039","sys":"resp","pts":1,"q":"\"Capacities are measurements of two or more volumes. The vital capacity (VC) measures the maximum amount of air that can be inhaled or exhaled during a respiratory cycle. It is the sum of the expiratory reserve volume, tidal volume, and inspiratory reserve volume. The inspiratory capacity (IC) is the amount of air that can be inhaled after the end of a normal expiration. It is, therefore, the sum of the tidal volume and inspiratory reserve volume. The functional residual capacity (FRC) includes the expiratory reserve volume and the residual volume. The FRC measures the amount of additional air that can be exhaled after a normal exhalation. Lastly, the total lung capacity (TLC) is a measurement of the total amount of air that the lung can hold. It is the sum of the residual volume, expiratory reserve volume, tidal volume, and inspiratory reserve volume. Lung volumes are measured by a technique called spirometry . An important measurement taken during spirometry is the forced expiratory volume (FEV) , which measures how much air can be forced out of the lung over a specific period, usually one second (FEV1). In addition, the forced vital capacity (FVC), which is the total amount of air that can be forcibly exhaled, is measured. The ratio of these values ( FEV1/FVC ratio ) is used to diagnose lung diseases including asthma, emphysema, and fibrosis. If the FEV1/FVC ratio is high, the lungs are not compliant (meaning they are stiff and unable to bend properly), and the patient most likely has lung fibrosis. Patients exhale most of the lung volume very quickly. Conversely, when the FEV1/FVC ratio is low, there is resistance in the lung that is characteristic of asthma. In this instance, it is hard for the patient to get the air out of his or her lungs, and it takes a long time to reach the maximal exhalation volume. In either case, breathing is difficult and complications arise. The The amount of air that can be expired forcibly after maximal inspiration is called:","imgs":["HS2IMG-fef044ac763cbae9.jpg"],"qh":"<div><div><div><div><div><p>&quot;Capacities are measurements of two or more volumes. The <strong>vital capacity (VC)</strong> measures the maximum amount of air that can be inhaled or exhaled during a respiratory cycle. It is the sum of the expiratory reserve volume, tidal volume, and inspiratory reserve volume. The <strong>inspiratory capacity (IC)</strong> is the amount of air that can be inhaled after the end of a normal expiration. It is, therefore, the sum of the tidal volume and inspiratory reserve volume. The <strong>functional residual capacity (FRC)</strong> includes the expiratory reserve volume and the residual volume. The FRC measures the amount of additional air that can be exhaled after a normal exhalation. Lastly, the <strong>total lung capacity (TLC)</strong> is a measurement of the total amount of air that the lung can hold. It is the sum of the residual volume, expiratory reserve volume, tidal volume, and inspiratory reserve volume.</p> <p>Lung volumes are measured by a technique called <strong>spirometry</strong>. An important measurement taken during spirometry is the <strong>forced expiratory volume (FEV)</strong>, which measures how much air can be forced out of the lung over a specific period, usually one second (FEV1). In addition, the forced vital capacity (FVC), which is the total amount of air that can be forcibly exhaled, is measured. The ratio of these values (<strong>FEV1/FVC ratio</strong>) is used to diagnose lung diseases including asthma, emphysema, and fibrosis. If the FEV1/FVC ratio is high, the lungs are not compliant (meaning they are stiff and unable to bend properly), and the patient most likely has lung fibrosis. Patients exhale most of the lung volume very quickly. Conversely, when the FEV1/FVC ratio is low, there is resistance in the lung that is characteristic of asthma. In this instance, it is hard for the patient to get the air out of his or her lungs, and it takes a long time to reach the maximal exhalation volume. In either case, breathing is difficult and complications arise.</p> [[IMG:HS2IMG-fef044ac763cbae9.jpg]]The</div> <div>The amount of air that can be expired forcibly after maximal inspiration is called:</div></div></div></div></div>","qt":"\"Capacities are measurements of two or more volumes. The vital capacity (VC) measures the maximum f his heart shows a murmur between the lub and dub sounds. Normal heart sounds “lub dub” are produced by ____. In the heart, the mitral valve is ____. Mitral regurgitation is a condition where the mitral valve does not close properly and some of the blood ____.","type":"cloze","bk":"dd","blanks":[{"label":"Answer 1:","options":["endocardium","epicardium","pericardium","myocardium"],"correct":"myocardium","ctx":"…and the heart muscle, known as the"},{"label":"Answer 2:","options":["The contraction of the large arteries attached to the heart","The movement of electrical activity through intercalated discs","The muscular contraction of the heart muscle","The blood hitting against the heart valves as they close"],"correct":"The blood hitting against the heart valves as they close","ctx":"…heart sounds “lub dub” are produced by"},{"label":"Answer 3:","options":["In between the left atrium and right atrium","A valve with two large cusps","Found on the right side between the atrium and ventricle","Found in the aorta to stop blood flowing back into the heart"],"correct":"A valve with two large cusps","ctx":"…In the heart, the mitral valve is"},{"label":"Answer 4:","options":["goes into the coronary sinus when the ventricles contract","returns to the right atrium when the ventricles contract","goes through the pulmonary valve when the ventricles contract","returns to the left atrium when the ventricles contract"],"correct":"returns to the left atrium when the ventricles contract","ctx":"…close properly and some of the blood"}],"vid":{"id":"uqWQDVSsbE4","t":"Blood flow of the Heart","d":"11:39","at":162},"ref":{"t":"Answer The two semilunar valves each has three half moon shaped flaps (0.5) that prevent backflow of blood from the large arteries leaving the ventricles(0.5) . When they close, a DUB sound is typically heart (the second heart sound). (0.5)","src":"CVS 2 learning page"}},{"id":"q4ff5e3df48","quiz":"211102","sys":"lymph","pts":4,"q":"Jo is admitted to hospital with a stab wound in the thigh, and has sustained major blood loss and is going into shock. 1. Identify the kind of shock that Jo may go into. (0.5) 2. Blood loss makes the blood pressure to become very low. Using the formula for blood pressure (BP = SV x HR x PR) explain how blood loss is related to low blood pressure. (0.5) 3. The excessive blood loss will reduce tissue perfusion in the capillary beds and affect lymph flow. 3.1 Discuss how the reduced perfusion will affect the hydrostatic pressure and oncotic pressure in the capillary beds.(1.5) 3.2 Explain why the blood loss will also affect lymph flow. (1)","imgs":[],"qh":"<p>Jo is admitted to hospital with a stab wound in the thigh, and has sustained major blood loss and is going into shock.</p> <p>1. Identify the kind of shock that Jo may go into. (0.5)</p> <p>2. Blood loss makes the blood pressure to become very low. Using the formula for blood pressure (BP = SV x HR x PR) explain how blood loss is related to low blood pressure. (0.5)</p> <p>3. The excessive blood loss will reduce tissue perfusion in the capillary beds and affect lymph flow.</p> <p>3.1 Discuss how the reduced perfusion will affect the hydrostatic pressure and oncotic pressure in the capillary beds.(1.5)</p> <p>3.2 Explain why the blood loss will also affect lymph flow. (1)</p>","qt":"Jo is admitted to hospital with a stab wound in the thigh, and has sustained major blood loss and is going into shock. 1. Identify the kind of shock that Jo may go into. (0.5) 2. Blood loss makes the blood pressure to become very low. Using the formula for blood pressure (BP = SV x HR x PR) explain how blood loss is related to low blood pressure. (0.5) 3. The excessive blood loss will reduce tissue perfusion in the capillary beds and affect lymph flow. 3.1 Discuss how the reduced perfusion will affect the hydrostatic pressure and oncotic pressure in the capillary beds.(1.5) 3.2 Explain why the blood loss will also affect lymph flow. (1)","type":"essay","saq":{"steps"
