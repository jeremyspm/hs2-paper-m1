rtery epicardium Same as epicardium","src":"CVS 2 learning page"}},{"id":"q53aabb598b","quiz":"211111","sys":"cvs","pts":4,"q":"Name four arteries that directly arise from the descending aorta, and the organs they supply.","imgs":[],"qh":"<p>Name <u>four </u>arteries that directly arise from the descending aorta, and the organs they supply.</p>","qt":"Name four arteries that directly arise from the descending aorta, and the organs they supply.","type":"essay","saq":{"steps":["Left and right renal arteries — the kidneys.","The coeliac trunk — via the common hepatic artery to the liver, the splenic artery to the spleen, the left gastric artery to the stomach.","The superior and inferior mesenteric arteries — the small and large intestine. (Also phrenic, suprarenal, gonadal — \"there are more than 4!\")","It finally splits into the common iliac arteries that supply each leg."],"src":"Her own answer · her feedback comment and the labelled aorta diagram she posted on it"},"vid":{"id":"oJ6ebQclqHI","t":"Lecture 3 - Blood vessels, circulation, and lymphatics","d":"59:28","at":3458},"ref":{"t":"Labelling some large arteries & veins below the diaphragm Celiac trunk Hepatic artery Gastric artery R Renal artery Abdominal aorta Common iliac artery External iliac artery Inferior vena cava Hepatic vein Splenic artery L Renal artery L Renal vein Superior mesenteric Inferior mesenteric Internal iliac artery","src":"2026 CIRCULATION VESSELS CV1-1 deck · slide 33"}},{"id":"qbebb57e18c","quiz":"211111","sys":"cvs","pts":2,"q":"Name the major blood vessels (artery and vein) in the neck.","imgs":[],"qh":"<p>Name the major <u>blood vessels</u> (artery and vein) in the neck.</p>","qt":"Name the major blood vessels (artery and vein) in the neck.","type":"essay","saq":{"steps":["Artery: the common carotid arteries (splitting into internal and external carotids), with the vertebral arteries behind them.","Vein: the jugular veins. (Brachiocephalic trunk and innominate artery are the same vessel.)"],"src":"Her own answer · her feedback comment and the neck-arteries diagram she posted on it"},"vid":{"id":"4wjCLiCCS6w","t":"Larynx and Phonation (part 1of 2) - Introduction and Cartilage framewo","d":"22:16","at":164},"ref":{"t":"Brachiocephalic artery R Subclavian artery Superior vena cava Pulmonary trunk* L Brachiocephalic vein L Subclavian artery R Common carotid artery Aortic arch L Subclavian vein L subclavian A L Common carotid artery L Pulmonary artery* Left jugular vein R Brachiocephalic vein PULMONARY CIRCULATION First colour the veins blue and the arteries red– how would you know? Look at the symmetry","src":"2026 CIRCULATION VESSELS CV1-1 deck · slide 31"}},{"id":"q0024fdf511","quiz":"211111","sys":"cvs","pts":2,"q":"Name the major artery to the upper limb. Name the major artery to the lower limb.","imgs":[],"qh":"<p>Name the major artery<u> to </u>the upper limb.</p> <p>Name the major artery <u>to</u> the lower limb.</p>","qt":"Name the major artery to the upper limb. Name the major artery to the lower limb.","type":"essay","saq":{"steps":["Arm — the subclavian artery, which continues as axillary → brachial → radial and ulnar (brachial and radial pulse sites).","Leg — the femoral artery (the iliac is still up in the hip), continuing as popliteal → anterior and posterior tibial → dorsalis pedis (femoral, popliteal, posterior tibial and dorsalis pedis pulse sites)."],"src":"Her own answer · her feedback comment and the limb-arteries diagram she posted on it"},"ref":{"t":"aortic arch descending aorta brachiocephalic artery subclavian artery carotid artery brachial artery radial artery external iliac artery femoral artery hepatic artery anterior tibial artery renal artery 1 2 3 Brachiocephalic artery 4 R Subclavian artery 5 R Carotid artery 6 Brachial artery 7 Radial artery 8 External Iliac A 9 Femoral A 10 Hepatic A 12 Renal A AWAY from the heart Ascending aorta Ulnar artery Axillary ","src":"2026 CIRCULATION VESSELS CV1-1 deck · slide 29"}},{"id":"qf1ab9b5f7a","quiz":"211111","sys":"cvs","pts":4,"q":"Name four veins that directly empty into the inferior vena cava and the organs they drain.","imgs":[],"qh":"<p>Name <u>four </u>veins that directly empty into the inferior vena cava and the organs they drain.</p>","qt":"Name four veins that directly empty into the inferior vena cava and the organs they drain.","type":"essay","saq":{"steps":["Common iliac veins — the legs and pelvis.","Renal veins — the kidneys; suprarenal veins — the adrenal glands.","Gonadal veins — the ovaries/testes.","Hepatic veins — the liver (carrying everything the hepatic portal vein brought in)."],"src":"Her own answer · her feedback comment on this question"},"ref":{"t":"Label as many as you can superior vena cava inferior vena cava external iliac vein femoral vein renal vein great saphenous vein anterior tibial vein L & R brachiocephalic veins jugular vein subclavian vein axillary vein brachial vein hepatic vein hepatic portal vein FIGURE 29-15 Principal veins of the body.","src":"2026 Cardiovascular system 2-2 deck · slide 5"}},{"id":"qf65610a72d","quiz":"211111","sys":"cvs","pts":3,"q":"Name a ll the blood vessels that merge to form the hepatic portal vein and the areas they drain. Describe the importance of the hepatic portal vein.","imgs":[],"qh":"<p>Name <u>a</u>ll the blood vessels that merge <u>to form</u> <u>the hepatic portal vein</u> and the areas they drain. Describe the importance of the hepatic portal vein.</p>","qt":"Name all the blood vessels that merge to form the hepatic portal vein and the areas they drain. Describe the importance of the hepatic portal vein.","type":"essay","saq":{"steps":["Superior mesenteric vein (small intestine, part of the colon) and splenic vein (spleen, with the inferior mesenteric vein from the large intestine joining it), plus the gastric veins from the stomach.","The hepatic portal vein carries blood from the gut capillaries through the liver capillaries WITHOUT going through the heart first.","That deoxygenated blood is full of absorbed nutrients that the liver must process (store, convert, detoxify) before they reach the general circulation."],"src":"Her own answer · her feedback comment and the portal-vein diagram she posted on it"},"ref":{"t":"Lungs are perfused by two circulations: pulmonary and bronchial Blood supply to the lungs The pulmonary circulation carries deoxygenated blood away from the heart to the lungs returns oxygenated blood back to the LA via pulmonary veins. The bronchial circulation supplies oxygenated blood to larger airways and lung tissue drains to the RA via the azygos vein and the superior vena cava.","src":"2026 RESP 1 deck · slide 30"}},{"id":"q368b31b003","quiz":"211111","sys":"cvs","pts":3,"q":"Use the histological images and diagrams provided on CANVAS to draw diagrams of an artery and a vein. Label clearly to show the differences (structural) between them, and the three layers in their walls, included notes on the functional differences too. Make sure you are comfortable with these differences!","imgs":["HS2IMG-e6ae3820cf768f36.jpg"],"qh":"<p>Use the histological images and diagrams provided on CANVAS to draw diagrams of an artery and a vein. <u>Label clearly</u> to show the <u>differences (structural)</u> between them, and the three layers in their walls, included notes on the functional differences too.</p> <p>[[IMG:HS2IMG-e6ae3820cf768f36.jpg]]</p> <p>Make sure you are comfortable with these differences!</p>","qt":"Use the histological images and diagrams provided on CANVAS to draw diagrams of an artery and a vein. Label clearly to show the differences (structural) between them, and the three layers in their walls, included notes on the functional differences too. Make sure you are comfortable with these differences!","type":"essay","saq":{"steps":["Both walls have three layers: tunica intima (endothelium), tunica media (smooth muscle ± elastic fibres), tunica adventitia/externa (connective tissue).","Artery: smaller round lumen, stiff appearance, THICK tunica media, clear internal (and external) elastic lamina, thin externa — it takes the pumping force of the heart and, in the arterioles, sets peripheral resistance.","Vein: larger floppy lumen, THIN media, thick externa, elastic lamina not clear, valves — veins come after the capillary beds so the heart’s pumping force is not transferred to them; muscle and breathing push the blood."],"src":"Her own answer · her artery-vs-vein table on the CVS Review quiz and the labelled histology image she posted"},"vid":{"id":"moMNBucCew8","t":"Cardiovascular | Tunic Layers & Types of Capillaries","d":"22:04","at":586,"ch":"nn"}},{"id":"q514a96de87","quiz":"211111","sys":"cvs","pts":5,"q":"The heart is located in a double walled bag made of connective tissue. 1. What is the difference between the visceral pericardium and the parietal pericardium? (0.5) 2. What layer of the pericardium is connected to the diaphragm? (0.5) 3. Between what pericardial layers do we find the pericardial fluid? (0.5) 4. What is the function of the pericardium and the pericardial fluid? (0.5) 5. What is meant with \"serous\" as in serous pericardium? (0.5)","imgs":["HS2IMG-8c32b09c7ac2030d.jpg"],"qh":"<div class=\"tbl\"><div class=\"tr\"><div class=\"td\">[[IMG:HS2IMG-8c32b09c7ac2030d.jpg]]</div> <div class=\"td\"><p>The heart is located in a double walled bag made of connective tissue.</p> <p>1. What is the difference between the visceral pericardium and the parietal pericardium? (0.5)</p> <p>2. What layer of the pericardium is connected to the diaphragm? (0.5)</p> <p>3. Between what pericardial layers do we find the pericardial fluid? (0.5)</p> <p>4. What is the function of the pericardium and the pericardial fluid? (0.5)</p> <p>5. What is meant with &quot;serous&quot; as in serous pericardium? (0.5)</p></div></div></div>","qt":"The heart is located in a double walled bag made of connective tissue. 1. What is the difference between the visceral pericardium and the parietal pericardium? (0.5) 2. What layer of the pericardium is connected to the diaphragm? (0.5) 3. Between what pericardial layers do we find the pericardial fluid? (0.5) 4. What is the function of the pericardium and the pericardial fluid? (0.5) 5. What is meant with \"serous\" as in serous pericardium? (0.5)","type":"essay","saq":{"steps":["1. Visceral = directly on the organ, covering the heart surface (the epicardium); parietal = the outer serous layer.","2. The parietal layer is connected to the diaphragm (the phrenico-pericardial ligament).","3. Pericardial fluid lies between the visceral and parietal SEROUS layers — the pericardial cavity.","4. Together they prevent friction (the fluid) and the thick fibrous outer layer prevents overfilling by giving the heart a maximum size it can stretch to.","5. \"Serous\" = it makes serum: a thin, watery, typically pale-yellow fluid."],"src":"Her own answer · her feedback comment on this question"},"vid":{"id":"dgAbpwp9gF8","t":"Cardiovascular | Structures and Layers of the Heart","d":"21:55","at":1149,"ch":"nn"}},{"id":"q59a2713249","quiz":"211111","sys":"cvs","pts":2,"q":"Why can you feel a pulse in an artery but not a vein?","imgs":[],"qh":"<p>Why can you feel a pulse in an artery but <u>not</u> a vein?</p>","qt":"Why can you feel a pulse in an artery but not a vein?","type":"essay","saq":{"steps":["The pulse is a wave of movement in the artery walls made by the pulsatile, \"squirty\" flow of blood from the heart.","The wave is not strong enough to travel through the capillary beds to the veins — it is the muscular effort of the body (and breathing), not the heart’s pumping, that pushes blood through veins."],"src":"Her own answer · her feedback comment on this question"},"ref":{"t":"Smaller arteries are called arterioles. VEINS The letters refer to the first micrograph. Veins are low pressure blood vessels returning blood to the heart. Bleeding from a vein would flow smoothly. There is no pump action behind it. The capillary beds and the many valves smooth out the flow.","src":"CVS 1 learning page"}},{"id":"q7d5529138c","quiz":"211111","sys":"cvs","pts":2,"q":"What types of abnormalities can an ECG detect? Give two examples of the abnormalities.","imgs":[],"qh":"<p>What types of abnormalities can an ECG detect? Give two examples of the abnormalities.</p>","qt":"What types of abnormalities can an ECG detect? Give two examples of the abnormalities.","type":"essay","saq":{"steps":["Only anomalies caused by changes in the heart’s ELECTRICAL activity: conduction, rate and rhythm.","Examples: rate — tachycardia (>100 b/min) or bradycardia (<60); rhythm — regular vs irregular, atrial or ventricular fibrillation; blocks and other conduction-system faults; type of myocardial infarction — STEMI (total coronary occlusion) vs NSTEMI (partial)."],"src":"Her own answer · her feedback comment on this question"},"vid":{"id":"zK2RIOqcuIU","t":"How to read an ECG / EKG","d":"3:29","at":172},"ref":{"t":"Uses of Electrocardiogram ECG detects changes in: Normal sinus rhythm Junctional rhythm Partial Heart block Ventricular fibrillation Heart Rate Tachy cardia (>100b/m) Brady cardia (<60 b/m) Heart rhythm – a rrhythmias Blood flow to the heart – e.g . ischemia, myocardial infarction, etc.","src":"2026 Cardiovascular 3A-1 deck · slide 18"}},{"id":"q2672d1d3e3","quiz":"211111","sys":"cvs","pts":4,"q":"Discuss the heart rate changes that occur/would occur during the different ECG readings suggested during the lab. Discuss why these changes occur? Sitting, resting Supine, resting Immediately on standing Immediately after exercise and standing","imgs":[],"qh":"<p>Discuss the heart rate changes that occur/would occur during the different ECG readings suggested during the lab. Discuss why these changes occur?</p> <div class=\"tbl\"><div class=\"tr\"><div class=\"td\"><ul><li>Sitting, resting</li></ul></div></div> <div class=\"tr\"><div class=\"td\"><ul><li>Supine, resting</li></ul></div></div> <div class=\"tr\"><div class=\"td\"><ul><li>Immediately on standing</li></ul></div></div> <div class=\"tr\"><div class=\"td\"><ul><li>Immediately after exercise and standing</li></ul></div></div></div>","qt":"Discuss the heart rate changes that occur/would occur during the different ECG readings suggested during the lab. Discuss why these changes occur? Sitting, resting Supine, resting Immediately on standing Immediately after exercise and standing","type":"essay","saq":{"steps":["Sitting, resting — around your resting heart rate.","Supine, resting — lying down the heart does not have to pump against gravity up to the head, so it works less hard; rate can fall.","Immediately on standing — the heart suddenly has to fight gravity: a sharp rise in rate to keep the head perfused, settling back to normal.","Immediately after exercise, standing — still pumping hard and fast: the muscles must restore their energy stores and need extra oxygen for a while, so the rate returns to normal only slowly."],"src":"Her own answer · her feedback comment on this question"},"ref":{"t":"Hypotension BP = 90/60 mmHg Orthostatic hypotension Low blood pressure when standing after sitting or lying down Shock a life-threatening condition where blood pressure drops dangerously low Shock stages:  ","src":"CVS 4 learning page"}},{"id":"qa915f2b409","quiz":"211124","sys":"cvs","pts":0.5,"q":"The volume of blood pumped out from a ventricle with each beat is the:","imgs":[],"qh":"<p>The volume of blood pumped out from a ventricle with each beat is the:</p>","qt":"The volume of blood pumped out from a ventricle with each beat is the:","type":"mcq","opts":["stroke volume","cardiac output","cardiac input","heart beat"],"key":["stroke volume"],"vid":{"id":"k-BWyBePu8Q","t":"Blood Pressure","d":"11:09","at":123,"alt":{"id":"nh08D29jepg","t":"Hypertension & Anti-Hypertensive Drugs","d":"24:58","at":246}},"ref":{"t":"= volume of blood pumped out from each ventricle in one minute CO = SV x HR Cardiac output = stroke volume x heart rate CARDIAC OUTPUT CO = 70ml/beat x 75 beats/min = 5.25L/min","src":"2026 Cardiovascular 3A-1 deck · slide 27"}},{"id":"q0abc67318d","quiz":"211124","sys":"cvs","pts":0.5,"q":"The membrane from which the heart valves are formed and which lines the interior of the heart is called the ......","imgs":[],"qh":"<p>The membrane from which the heart valves are formed and which lines the interior of the heart is called the ......</p>","qt":"The membrane from which the heart valves are formed and which lines the interior of the heart is called the......","type":"mcq","opts":["endocardium","myocardium","epicardium","pericardium"],"key":["endocardium"],"vid":{"id":"O7W8jegLokE","t":"ST Elevation vs ST Depression","d":"15:52","at":387},"ref":{"t":"Right atrium Left atrium Right ventricle Left ventricle Tricuspid valve Bicuspid valve Pulmonary valve Aortic valve Pulmonary trunk branching into L & R pulmonary arteries Aorta Pulmonary vein Superior vena Cava Inferior vena Cava Pulmonary vein Heart interior 4 chambers 4 valves Veins Bringing blood to heart Arteries taking blood away from heart apex septum","src":"2026 Cardiovascular system 2-2 deck · slide 11"}},{"id":"qc1d6e590b2","quiz":"211124","sys":"cvs","pts":0.5,"q":"By far the thickest layer of the heart wall is the muscular ................","imgs":[],"qh":"<p>By far the thickest layer of the heart wall is the muscular ................</p>","qt":"By far the thickest layer of the heart wall is the muscular................","type":"mcq","opts":["myocardium","pericardium","endocardium","epicardium"],"key":["myocardium"],"vid":{"id":"uKrgEv7-rVM","t":"Parts of the Cardiac System (Heart Anatomy)","d":"7:57","at":40},"ref":{"t":"foramen ovale aortic arch fossa ovalis coronary ostia HEART WALL STRUCTURES descending aorta trabecular cardiac muscle brachiocephalic trunk pectinate muscles left carotid artery myocardium left subclavian artery epicardium Same as epicardium","src":"CVS 2 learning page"}},{"id":"q88a ut) together. It is known as the trachealis and contracts when we cough.","imgs":["HS2IMG-07448c35c77d9686.png"],"qh":"<p>[[IMG:HS2IMG-07448c35c77d9686.png]]</p> <p>The stripy muscle at the back of the trachea holds the ends of the C-shaped cartilage rings (looking like white teeth when cut) together. It is known as the <strong>trachealis</strong> and contracts when we cough.</p>","qt":"The stripy muscle at the back of the trachea holds the ends of the C-shaped cartilage rings (looking like white teeth when cut) together. It is known as the trachealis and contracts when we cough.","type":"tf","opts":["True","False"],"key":["True"]},{"id":"qb0822429de","quiz":"211144","sys":"resp","pts":1,"q":"At the point where the trachea branches into two bronchiole, we find the sensitive Carina, When particles land on it, we cough.","imgs":["HS2IMG-69e5200759cf127c.png"],"qh":"<p>[[IMG:HS2IMG-69e5200759cf127c.png]]</p> <p>At the point where the trachea branches into two bronchiole, we find the sensitive Carina, When particles land on it, we cough.</p>","qt":"At the point where the trachea branches into two bronchiole, we find the sensitive Carina, When particles land on it, we cough.","type":"tf","opts":["True","False"],"key":["False"],"ref":{"t":"Lungs for Conduction of air Ventilation: Nasal cavities (with conchae), Sinuses, Pharynx, Larynx, Trachea, Bronchi, to terminal Bronchiole Air conditioning and self cleaning (muco-ciliary escalator, cough reflex (carina & trachealis muscle))","src":"RESP 1 learning page"}},{"id":"qca33af1cee","quiz":"211144","sys":"resp","pts":4,"q":"Find and describe at least ONE error in the labelling of the AI created summary below and describe it in the answer space.","imgs":["HS2IMG-46a4cf5a79d64979.png"],"qh":"<p><strong>Find and describe at least ONE error in the labelling of the AI created summary below and describe it in the answer space. </strong></p> <p>[[IMG:HS2IMG-46a4cf5a79d64979.png]]</p>","qt":"Find and describe at least ONE error in the labelling of the AI created summary below and describe it in the answer space.","type":"essay","saq":{"steps":["The label lines for the visceral and parietal pleura point at the intercostal muscles, not the membranes.","The interpleural space could be labelled more accurately — the two pleural layers are clearly visible.","The structure labelled \"bronchiole\" has cartilage in its wall, so it is a small bronchus — bronchioles have no cartilage.","The structure labelled as a bronchiole in the alveolar picture is in fact an alveolus."],"src":"Her own answer · her feedback comment (and marked-up images) on this question"},"vid":{"id":"CFHUYTPc7So","t":"Respiratory Tract","d":"24:54","at":1219},"ref":{"t":"Surrounding the lungs= double membrane the pleura (see Patton, (2019), FIGURE 35-18 shown below). Visceral pleura clings to lungs Parietal pleura clings to the inside of the thoracic wall Interpleural space between the two pleural layers - negative pressure to help the lung move with the thoracic space Pneumothorax = when air leaks into interpleural space and lungs cannot not expand","src":"RESP 1 learning page"}},{"id":"q698c3b839c","quiz":"211920","sys":"resp","pts":6,"q":"Diseases like COPD and Pneumonia affect different parts of the lungs. COPD affects mainly the conductive zone and pneumonia the respiratory zone. Explain this statement.","imgs":[],"qh":"<p>Diseases like COPD and Pneumonia affect different parts of the lungs. COPD affects mainly the conductive zone and pneumonia the respiratory zone. Explain this statement.</p>","qt":"Diseases like COPD and Pneumonia affect different parts of the lungs. COPD affects mainly the conductive zone and pneumonia the respiratory zone. Explain this statement.","type":"essay","saq":{"steps":["COPD → the conductive zone: nose, pharynx, trachea, bronchi, bronchioles — the parts bringing air to and from the respiratory zone and cleaning/conditioning it.","It obstructs airflow through inflammation, mucus production and airway narrowing as the smooth muscle contracts.","Ventilation becomes hard work, so accessory muscles are needed to create a big enough pressure gradient to move air in and out.","Pneumonia → the respiratory zone: respiratory bronchioles and alveoli, where external respiration (gas exchange) happens.","It fills the lungs with fluid and pus, increasing the diffusion distance — simple diffusion needs thin membranes to be efficient.","So the blood cannot be oxygenated sufficiently (O₂ must move in) and CO₂ cannot be got out."],"src":"Her own answer · her feedback comment on this question"},"ref":{"t":"Process by which O 2 moves out of the alveoli into the blood and CO 2 moves out of the blood into the alveoli Gases move across the respiratory membrane by simple diffusion from areas of high pressure to low pressure External Respiration - Pulmonary gas exchange Gas Alveolar air Pulmonary arterial blood Pressure gradient P O2 104 mmHg 40 mmHg 64 P CO2 40 mmHg 45 mmHg 5","src":"2026 Resp 2-2 deck · slide 23"}},{"id":"q21fcf59f6c","quiz":"211920","sys":"resp","pts":8,"q":"Breathing can influence the pH of the blood. Discuss the following statement. Hyperventilation and hypoventilation can both cause blood pH abnormalities but hyperventilation and hypoventilation can also both alleviate blood pH abnormalities.","imgs":[],"qh":"<p>Breathing can influence the pH of the blood. Discuss the following statement.</p> <p>Hyperventilation and hypoventilation can both <strong>cause </strong>blood pH abnormalities but hyperventilation and hypoventilation can also both <strong>alleviate</strong> blood pH abnormalities.</p>","qt":"Breathing can influence the pH of the blood. Discuss the following statement. Hyperventilation and hypoventilation can both cause blood pH abnormalities but hyperventilation and hypoventilation can also both alleviate blood pH abnormalities.","type":"essay","saq":{"steps":["Hyperventilation (fast, deep): CO₂ is blown off faster than it is produced → less CO₂ in the blood → blood more alkaline → respiratory alkalosis.","Hypoventilation (slow, shallow): less CO₂ blown out than produced → more CO₂ in the blood → blood more acidic → respiratory acidosis.","But in METABOLIC alkalosis (kidney, GI causes — e.g. a lot of vomiting) slow, shallow breathing retains CO₂ to bring the pH DOWN: hypoventilation as compensation.","And in METABOLIC acidosis (e.g. diabetic ketoacidosis) fast, deep breathing gets rid of CO₂ to bring the pH UP: hyperventilation as compensation."],"src":"Her own answer · her feedback comment on this question"},"vid":{"id":"uk0WpLoD8SE","t":"Metabolic Acidosis & Alkalosis","d":"25:49","at":1428},"ref":{"t":"4. Discuss how forced breathing (hyperventilation) impacts blood pH and why. There should always be low levels of CO2in the blood to maintain *buffer) the pH within the normal range. With forced breathing, more CO2is breathed out than is produced by metabolic processes. It causes the reactionCO₂+H₂O↔H₂CO₃↔H⁺+HCO₃⁻) to shift to theleftwithless hydrogen ionsavailable to balance (buffer) the blood pH. Without the CO2pre","src":"RESP 3 learning page"}},{"id":"q4be7d1967b","quiz":"211920","sys":"resp","pts":6,"q":"Discuss the role of the accessory muscles in forced breathing.","imgs":[],"qh":"<p>Discuss the role of the accessory muscles in forced breathing.</p>","qt":"Discuss the role of the accessory muscles in forced breathing.","type":"essay","saq":{"steps":["Accessory muscles are recruited when extra ventilation is needed — exercise, or disease.","Forced inhalation: neck muscles (scalenes, sternocleidomastoid) and chest muscles (pectoralis) lift the ribs, sternum and collarbone higher, making the thoracic cavity even larger than normal for a greater pressure gradient.","Forced exhalation: abdominal muscles (rectus abdominis, external and internal obliques) compress the abdominal organs and push the diaphragm higher, and the internal intercostals pull the ribs down and in — a thoracic cavity even smaller than norma dium) lies directly on the organ, covering the heart surface.","Parietal pericardium is the outer serous layer, lining the fibrous pericardium; the pericardial cavity with its fluid lies between the two."],"src":"Her own answer · her feedback on the CVS Lab Review pericardium question"},"vid":{"id":"IivVcea01xI","t":"Epithelia | Podcast","d":"82:29","at":2837},"ref":{"t":"Coverings of the heart Superficial: Fibrous Parietal pericardium Deeper : Serous Parietal Pericardium Pericardial Fluid in pericardial space Deep: Visceral pericardium = epicardium  ","src":"2026 Cardiovascular system 2-2 deck · slide 7"}},{"id":"qb7d81fe0de","quiz":"212709","sys":"cvs","pts":3,"q":"What is the difference between: Pericardium, epicardium and endocardium?","imgs":[],"qh":"<p><strong>What is the difference between: </strong><strong>Pericardium, epicardium and endocardium?</strong></p>","qt":"What is the difference between: Pericardium, epicardium and endocardium?","type":"essay","saq":{"steps":["Pericardium: the double-walled bag around the heart — a tough outer fibrous pericardium and a serous pericardium with parietal and visceral layers and pericardial fluid between them.","Epicardium: the visceral layer of the serous pericardium — the outermost layer of the heart WALL, with a layer of fatty connective tissue between it and the myocardium.","Endocardium: the smooth inner lining of the chambers and valves, continuous with the lining of the vessels (endocarditis = its inflammation, with valve complications)."],"src":"Model answer is the tool’s · from her CVS 2 learning page, Task 1, and her heart-coverings post (Patton Fig 28-5)"},"ref":{"t":"Layers of blood vessel walls = connective tissues to bind vessels to the surrounding tissues Small blood vessels providing the tunica externa= vasa vasorum Thick black line on internal side – INTERNAL ELASTIC LAMINA –forms the border of the Tunica intima mostly of smooth muscle- Vasoconstriction/dilation Thicker in arteries INNER LINING MIDDLE  DUB sound?","imgs":[],"qh":"<p><strong>Heart sounds can be heard when the semilunar and atrioventricular valves CLOSE. It sounds like LUB-DUB. Which closure makes the LUB sound and which one the DUB sound? </strong></p>","qt":"Heart sounds can be heard when the semilunar and atrioventricular valves CLOSE. It sounds like LUB-DUB. Which closure makes the LUB sound and which one the DUB sound?","type":"essay","saq":{"steps":["LUB (first heart sound) = closure of the atrioventricular valves (tricuspid and mitral) as the ventricles start to contract.","DUB (second heart sound) = closure of the semilunar valves (aortic and pulmonary) as the ventricles relax."],"src":"Her own answer · her CVS 2 learning page SAQ answers"},"vid":{"id":"XyxuzHX1Grg","t":"Heart Sounds & Surface Anatomy | Cardiology","d":"6:04","at":251},"ref":{"t":"4 Valves Tricuspid & Bicuspid (Mitral) Chordae tendineae prevent AV valve flaps from opening to wrong side Papillary muscle anchor chordae tendinea to heart wall Heart Valves AV valves? Pulmonary & Aortic valves Closure makes 1 st heart sound (LUB) Semilunar valves? Closure makes 2 nd heart sound (DUB) Embryonic structures Foramen Ovale  Fossa Ovalis Ductus Arteriosus  Ligamentum Arteriosum","src":"2026 Cardiovascular system 2-2 deck · slide 24"}},{"id":"q2610b388e1","quiz":"212709","sys":"cvs","pts":3,"q":"Extra sounds are called murmurs. What may cause heart murmurs?","imgs":[],"qh":"<p><strong>Extra sounds are called murmurs. What may cause heart murmurs? </strong></p>","qt":"Extra sounds are called murmurs. What may cause heart murmurs?","type":"essay","saq":{"steps":["A valve that does not close properly (incompetent/leaky) — blood regurgitates back where it came from and swishes.","A valve that does not open properly (stenosis — stiff, narrowed flaps, e.g. after endocarditis) — blood is forced through a narrow opening turbulently.","Either way, turbulent rather than smooth flow makes the extra sound; the result can be reduced cardiac outpu reases"},{"v":"now below atmospheric, so"},{"t":"air is sucked in down the pressure gradient"}]},{"id":"expiration","sys":"resp","name":"Quiet expiration — entirely passive","src":"Module 1 guide · The bellows (criteria 6, 7)","beads":[{"t":"inspiratory muscles relax"},{"v":"and with nothing holding the stretch, the"},{"t":"elastic recoil of lungs and chest wall"},{"v":"pulls everything back in, so"},{"t":"thoracic volume decreases"},{"v":"and less volume means"},{"t":"intrapulmonary pressure rises above atmospheric"},{"v":"now above atmospheric, so"},{"t":"air flows out"}]},{"id":"emphysema","sys":"resp","name":"Emphysema · why expiration is the problem","src":"Module 1 guide · The bellows (criteria 6, 7)","beads":[{"t":"alveolar elastic fibres are destroyed"},{"v":"so recoil is lost and"},{"t":"compliance rises — the lungs inflate easily"},{"v":"but with nothing pulling them back,"},{"t":"small airways collapse on expiration"},{"v":"so"},{"t":"air is trapped"},{"v":"and trapped air means"},{"t":"residual volume and FRC rise"},{"v":"so each breath adds less fresh air, and destroyed walls also mean"},{"t":"less surface area for exchange"}]},{"id":"asthma","sys":"resp","name":"An asthma attack","src":"Module 1 guide · The bellows (criteria 6, 7)","beads":[{"t":"trigger"},{"v":"reaches the airway and"},{"t":"mast cells release histamine"},{"v":"which produces three narrowings at once —"},{"t":"bronchoconstriction + wall oedema + excess mucus"},{"v":"and three narrowings in one tube mean"},{"t":"airway resistance rises"},{"v":"so"},{"t":"less air reaches the alveoli"}]},{"id":"external-resp","sys":"resp","name":"External respiration","src":"Module 1 guide · The ferry (criteria 1, 8–16)","beads":[{"t":"alveolar PO₂ 104 against capillary PO₂ 40"},{"v":"which is a steep"},{"t":"partial pressure gradient"},{"v":"so oxygen diffuses across the"},{"t":"respiratory membrane"},{"v":"into the red cell, where it"},{"t":"binds the haem iron"},{"v":"forming"},{"t":"oxyhaemoglobin"},{"v":"and blood leaves the lung at"},{"t":"PO₂ 100, about 98% saturated"}]},{"id":"internal-resp","sys":"resp","name":"Internal respiration","src":"Module 1 guide · The ferry (criteria 1, 8–16)","beads":[{"t":"arterial PO₂ 100 against tissue PO₂ below 40"},{"v":"so"},{"t":"oxygen diffuses out of the blood"},{"v":"and at the same time tissue PCO₂ above 45 against blood at 40 means"},{"t":"carbon dioxide diffuses into the blood"},{"v":"so what leaves the tissue is"},{"t":"venous blood at PO₂ 40, PCO₂ 45"}]},{"id":"bohr","sys":"resp","name":"The Bohr effect","src":"Module 1 guide · The ferry (criteria 1, 8–16)","beads":[{"t":"active tissue is warm, acidic and CO₂-rich"},{"v":"and those three conditions mean"},{"t":"haemoglobin's affinity for oxygen falls"},{"v":"which on the graph means the"},{"t":"curve shifts to the right"},{"v":"so at the very same PO₂"},{"t":"more oxygen is released"},{"v":"and that means"},{"t":"the tissue working hardest gets the most"}]},{"id":"hypoventilation","sys":"resp","name":"Hypoventilation to respiratory acidosis","src":"Module 1 guide · The ferry (criteria 1, 8–16)","beads":[{"t":"breathing slows — head injury, opioids, COPD"},{"v":"so less gas is blown off and"},{"t":"CO₂ is retained"},{"v":"which pushes the carbonic acid equation"},{"t":"to the right"},{"v":"producing more carbonic acid, which dissociates, so"},{"t":"H⁺ concentration rises"},{"v":"and more free acid means"},{"t":"pH falls below 7.35"},{"v":"which is called"},{"t":"respiratory acidosis"}]},{"id":"hyperventilation","sys":"resp","name":"Hyperventilation to respiratory alkalosis","src":"Module 1 guide · The ferry (criteria 1, 8–16)","beads":[{"t":"breathing beyond metabolic need — panic, pain"},{"v":"so too much gas is blown off and"},{"t":"CO₂ falls — hypocapnia"},{"v":"which pulls the carbonic acid equation"},{"t":"to the left"},{"v":"consuming H⁺ to replace the lost CO₂, so"},{"t":"H⁺ concentration falls"},{"v":"and less free acid means"},{"t":"pH rises above 7.45"},{"v":"which is called"},{"t":"respiratory alkalosis"}]},{"id":"co2-drive","sys":"resp","name":"Why CO2 is the normal drive to breathe","src":"Module 1 guide · The ferry (criteria 1, 8–16)","beads":[{"t":"arterial PCO₂ rises"},{"v":"and CO₂ crosses the"},{"t":"blood–brain barrier easily"},{"v":"where it reacts with water to make"},{"t":"H⁺ in the cerebrospinal fluid"},{"v":"which is sensed by the"},{"t":"central chemoreceptors in the medulla"},{"v":"the strongest stimulus to breathe there is, so"},{"t":"rate and depth increase"},{"v":"and more ventilation means"},{"t":"CO₂ is blown off and pH returns to normal"}]},{"id":"acidosis-response","sys":"resp","name":"The acidosis response — her 10-mark question","src":"Module 1 guide · The ferry (criteria 1, 8–16)","beads":[{"t":"hydrogen ions rise"},{"v":"and more free acid means"},{"t":"pH decreases"},{"v":"which is detected by"},{"t":"chemoreceptors"},{"v":"sited"},{"t":"centrally in the brain, peripherally in carotid & aortic bodies"},{"v":"which signal the"},{"t":"ventral respiratory group"},{"v":"the rhythm generator sitting in the"},{"t":"medulla oblongata"},{"v":"which sends impulses down the"},{"t":"phrenic nerve"},{"v":"to the diaphragm, producing"},{"t":"increased rate and depth"},{"v":"and blowing off more gas means"},{"t":"CO2 decreases"},{"v":"and less carbon dioxide drives the equation left, so"},{"t":"pH returns to normal"}]},{"id":"lymph-path","sys":"lymph","name":"Where lymph goes","src":"Module 1 guide · The drain and the guard (criteria 1–4 · Case Study 5)","beads":[{"t":"interstitial fluid"},{"v":"the tenth the capillaries left behind is picked up by"},{"t":"lymph capillaries"},{"v":"blind-ended, with one-way minivalves, which drain into"},{"t":"lymph collecting vessels"},{"v":"which carry lymph through"},{"t":"lymph nodes"},{"v":"where macrophages and lymphocytes filter it, and on into"},{"t":"lymphatic trunks"},{"v":"which merge into the two"},{"t":"lymphatic ducts"},{"v":"which empty into the"},{"t":"subclavian vein"}]},{"id":"immune-start","sys":"lymph","name":"How an immune response actually starts","src":"Module 1 guide · The drain and the guard (criteria 1–4 · Case Study 5)","beads":[{"t":"antigen enters the tissue"},{"v":"and a resident"},{"t":"antigen-presenting cell engulfs it"},{"v":"breaks it up and"},{"t":"displays fragments on MHC II"},{"v":"then it"},{"t":"migrates to the nearest lymph node"},{"v":"where the displayed fragment"},{"t":"activates a matching helper T cell"},{"v":"which divides and releases"},{"t":"cytokines released"},{"v":"and those cytokines drive"},{"t":"B cells → plasma cells + memory cells"}]},{"id":"vaccination","sys":"lymph","name":"How a vaccine works","src":"Module 1 guide · The drain and the guard (criteria 1–4 · Case Study 5)","beads":[{"t":"a vaccine gives the antigen without the pathogen"},{"v":"which triggers a full"},{"t":"primary response"},{"v":"slow and weak, but it produces"},{"t":"plasma cells and MEMORY cells"},{"v":"which persist, so that on"},{"t":"real exposure later"},{"v":"the memory cells fire off a"},{"t":"secondary response in hours, with far more IgG"},{"v":"fast enough and strong enough that"},{"t":"illness is prevented"}]},{"id":"lymphoedema","sys":"lymph","name":"Lymphoedema after node clearance","src":"Module 1 guide · The drain and the guard (criteria 1–4 · Case Study 5)","beads":[{"t":"axillary lymph nodes are removed"},{"v":"so the"},{"t":"drainage route for that arm is destroyed"},{"v":"and the ~10% of capillary filtrate that normally leaves as lymph"},{"t":"has nowhere to go"},{"v":"so it"},{"t":"accumulates in the interstitial space"},{"v":"and swelling caused by blocked drainage is"},{"t":"lymphoedema"}]}],"cases":[{"id":"lymph","sys":"lymph","name":"Exam case 2 · The aftereffects of lymph node removal","scenario":"Aleki and Vicky visit their friend, Mary who had undergone a right mastectomy for cancer a fortnight ago. Mary mentioned the cancer had spread to the lymph nodes and that some axillary lymph nodes were also removed. She complained of swelling in the right arm after the surgery. Her friend, who is good with mirimiri and massage offers to help massage her arm, which helps to bring down the swelling.","questions":[{"q":"What are the major functions of the lymphatic system, which the lymph is a part of?","marks":3,"steps":["Digestive: lacteals in the gut, into which dietary fat is absorbed to be taken for processing.","Immunological: the immune response — thymus (T cells mature), bone marrow (B cells mature, making antibodies), lymph nodes (where lymphocytes and other immune cells interact to create and coordinate an immune response; areas of high immune-cell activity).","Fluid balance: the drainage points of interstitial fluid — draining away excess tissue fluid for monitoring (any antigens are easily found) and returning it to the venous system."],"src":"Her answer · 2024 case-study model-answers deck, slides 3–5"},{"q":"What is the role of the axillary lymph nodes in the spread of cancer? Explain.","marks":2,"steps":["Spread of cancer is metastasis: if a cancerous cell detaches from its origin (a tumour) and gets into the lymphatic system it can potentially reach any part of the body.","We check the axillary (armpit) nodes for cancer cells: the first node to be affected, closest to the breast, is the sentinel node — cancer cells there show the cancer has spread; none there gives some confidence it is limited to the breast."],"src":"Her answer · 2024 case-study model-answers deck, slide 6"},{"q":"Why did Mary develop swelling in the right arm after mastectomy? You will need to think about fluid dynamics, and what causes fluid to move into or still in the interstitial spaces (tissue space).","marks":2,"steps":["When the lymph nodes are removed, the fluid that normally drains from the arm through those nodes is blocked.","With nowhere for the remaining tissue fluid to go (normally it drains through the lymphatic vessels and returns to the venous system at the subclavian vein), the lymphatic vessels fill until they cannot drain the tissue fluid from the tissue — lymphoedema."],"src":"Her answer · 2024 case-study model-answers deck, slide 7"}]},{"id":"asthma","sys":"resp","name":"Exam case 3 · Asthma","scenario":"Ane has had severe asthma since they were young. During a particularly bad asthma attack, Ane is experiencing difficulty breathing, particularly on the out-breath. Ane’s asthma is often triggered by small particles of pollen that manage to make their way into their lungs despite the protective features designed to keep them out. Ane makes sure to have their Salbutamol inhaler, which helps to relieve the symptoms of their asthma attack.","questions":[{"q":"What term is used to describe difficulty breathing?","marks":1,"steps":["Dyspnoea — dys (bad, not good) + pnoea (breathing). Compare eupnoea (normal), tachypnoea (fast), apnoea (none), hyperventilation (hard and fast, changing blood CO₂)."],"src":"Her answer · 2024 case-study model-answers deck, slide 17"},{"q":"What is happening in Ane’s lungs to make breathing difficult?","marks":3,"steps":["Bronchoconstriction: the airway becomes constricted — the smooth muscle around it has contracted.","Inflammation: the wall of the airway is thick with swelling.","Increased mucus secretion as well — less room for air."],"src":"Her answer · 2024 case-study model-answers deck, slide 18"},{"q":"How is Ane’s ventilation and airway resistance impacted?","marks":2,"steps":["Airway resistance is high → harder to breathe (a greater pressure difference is required) → dyspnoea.","Accessory respiratory muscles are recruited — extra muscles for breathing, an \"increase in the work of breathing\"."],"src":"Her answer · 2024 case-study model-answers deck, slide 18"},{"q":"How does an inhaler help when Ane is having an asthma attack?","marks":1,"steps":["A reliever inhaler is a BRONCHODILATOR: it forces the airway smooth muscle to relax, which lets the airway widen and relieves the symptoms so you can breathe. (A preventer is a corticosteroid — anti-inflammatory.)"],"src":"Her answer · 2024 case-study model-answers deck, slide 18"},{"q":"How does the body usually keep dust and small particles out of the lungs? There are several mechanisms for this!","marks":3,"steps":["Mucus and cilia — the muco-ciliary escalator.","Nasal hairs — a filter that traps particles, which end up stuck in mucus.","The carina at the bottom of the trachea stimulates the cough reflex; the epiglottis keeps large objects out of the trachea (not effective against small particles)."],"src":"Her answer · 2024 case-study model-answers deck, slide 19"},{"q":"The muco-cillary escalator is one of the mechanism. How does the muco-cillary escalator work?","marks":2,"steps":["Cilia — small hair-like structures lining the respiratory epithelium — beat to sweep mucus up and out of the airways.","Mucus is sticky: particles and dust get stuck in it and are trapped, then carried up on the cilia."],"src":"Her answer · 2024 case-study model-answers deck, slide 20"},{"q":"Smoking damages this escalator – how would this impact a smoker?","marks":2,"steps":["The cilia are damaged, so mucus cannot be moved up and out of the lungs.","A smoker’s cough develops to replace the lost function of the cilia."],"src":"Her answer · 2024 case-study model-answers deck, slide 20"},{"q":"Ane’s blood pressure was high due to their fight or flight response. What process helps to return their blood pressure back to normal after their asthma attack? (Think the full process!)","marks":4,"steps":["Baroreceptors in the aortic arch and carotid sinus are stretched more by the high pressure and fire faster.","They signal the cardiac and vasomotor centres in the medulla oblongata.","The cardiac inhibitory centre is stimulated: parasympathetic (vagus) impulses to the SA node release acetylcholine, so heart rate (and stroke volume) fall.","The vasomotor centre is inhibited: less sympathetic tone, arterioles dilate, peripheral resistance falls — BP = HR × SV × PR comes back down to the set point."],"src":"Model answer is the tool’s · from her CVS 4 learning page and her neural-regulation comment (her deck answers this with a diagram)"}]},{"id":"panic","sys":"resp","name":"Exam case 4 · Panic attacks","scenario":"Manaia lives with an anxiety disorder, which sometimes manifests in panic attacks that impact on her breathing. Manaia describes her panic attack as a time when she breathes really really hard and fast and cannot control her breathing at all. You know that there is a link between breathing and the pH of your blood because the respiratory system is one of the buffer systems of the body. You know that during a prolonged panic attack, Manaia might be at risk of what is called respiratory alkalosis, but you’ll need to remember why this is.","questions":[{"q":"Breathing, or the process of pulmonary ventilation is how you move air in and out of your lungs and requires a specific series of steps. Bullet point the steps involved in Manaia’s inhalation.","marks":4,"steps":["The diaphragm contracts (lowering its dome) and the external intercostal muscles contract (moving the ribs up and out).","This enlarges the thoracic cavity and reduces the pressure in the intrapleural cavity (Boyle’s law).","The intrapulmonary cavity enlarges — volume increases — lowering the intrapulmonary pressure.","Air flows in from the atmosphere, from high pressure to low."],"src":"Her answer · 2024 case-study model-answers deck, slide 10"},{"q":"Bullet point the steps involved in Manaia’s exhalation.","marks":4,"steps":["The diaphragm relaxes (its dome rises) and the external intercostals relax (ribs move down and in).","The elastic lungs recoil passively, reducing the intrapulmonary volume.","Intrapulmonary pressure rises (Boyle’s law).","Air flows out of the lungs, from the higher intrapulmonary pressure to the lower atmospheric pressure."],"src":"Her answer · 2024 case-study model-answers deck, slide 11"},{"q":"Manaia feels tired after a panic attack because forced breathing requires more muscular effort. Which muscles are used in forced breathing? Be specific!","marks":2,"steps":["Breathing in: diaphragm and external intercostals contract; when forced, also the neck muscles — sternocleidomastoid and scalenes.","Breathing out: diaphragm and external intercostals relax; when forced, the abdominal muscles and the internal intercostals contract."],"src":"Her answer · 2024 case-study model-answers deck, slide 12"},{"q":"What are some of the factors that influence your pulmonary ventilation (make it easier or harder) and how do they do this?","marks":3,"steps":["Airway obstruction by fluid, mucus and/or swelling (COPD, asthma) narrows the airways, raising resistance to airflow and the muscular effort needed to inhale and exhale.","Lung compliance — the ease with which the lungs expand — which scar tissue reduces; thoracic-cage abnormalities (rib-cage flexibility, diaphragm problems); alveolar problems — lack of surfactant so alveoli do not expand, or fluid build-up.","Interference with the negative intrapleural pressure that couples the lungs to the thoracic wall: air in the pleural cavity (pneumothorax) leads to collapse of the lung (atelectasis)."],"src":"Her answer · 2024 case-study model-answers deck, slide 12"},{"q":"What is normal blood pH?","marks":1,"steps":["7.35–7.45 (average 7.4). Below 7.35 = acidotic; above 7.45 = alkalotic."],"src":"Her answer · 2024 case-study model-answers deck, slide 13"},{"q":"Draw the chemical equation (in words or chemical formula) for the bicarbonate buffer system in the blood","marks":1,"steps":["CO₂ + H₂O ⇌ H₂CO₃ ⇌ H⁺ + HCO₃⁻ — carbon dioxide + water ⇌ carbonic acid ⇌ hydrogen ions + bicarbonate ions."],"src":"Her answer · 2024 case-study model-answers deck, slide 13"},{"q":"How do changes in the respiratory rate and depth (like Manaia’s panic attack) affect the blood pH?","marks":3,"steps":["Changing the rate and depth of breathing changes the CO₂ level in the alveoli, and so the CO₂ level in the blood.","Blood CO₂ directly drives the bicarbonate buffer equation, so the same change happens to the H⁺ level — and a change in H⁺ is a change in pH.","Manaia’s hyperventilation blows off CO₂ → the buffer uses up H⁺ and bicarbonate to replace it → H⁺ falls → pH rises: respiratory alkalosis. (Hypoventilation, e.g. head trauma, does the opposite: CO₂ up, H⁺ up, pH down — respiratory acidosis.)"],"src":"Her answer · 2024 case-study model-answers deck, slides 14 and 16"},{"q":"How does the respiratory system respond when something causes the blood pH to change? (This is back to BN1 when you talked about ketoacidosis!)","marks":2,"steps":["Metabolic acidosis (H⁺ up): the body responds with hyperventilation — H⁺ is converted into CO₂ and water and the extra CO₂ is breathed off, so the breathing rate increases.","Metabolic alkalosis (H⁺ down): the body responds with hypoventilation — CO₂ is kept in the body and turned into H⁺ and bicarbonate to replace the lost H⁺, so the breathing rate decreases. The same buffer system works both ways: whatever happens to CO₂ happens to H⁺."],"src":"Her answer · 2024 case-study model-answers deck, slides 14–15"}]}],"held":[{"quiz":"Heart Anatomy (40 mk)","why":"image did not survive capture","q":"Anatomical Structures of the Heart Match the items to correctly identify the str"},{"quiz":"Heart Anatomy (40 mk)","why":"image did not survive capture","q":"Anatomical Structures of the Heart Match the items to correctly identify the str"},{"quiz":"Lymphatic: Diseases & Terminology","why":"image did not survive capture","q":"Check the image in the linked article . What types of blood cells predominate in"},{"quiz":"Lymphatic: Diseases & Terminology","why":"image did not survive capture","q":"Check the image in the linked article : Lymph from the interstitial spaces in th"},{"quiz":"Lymphatic: Diseases & Terminology","why":"image did not survive capture","q":"Check the im /* ── dealing ───────────────────────────────────────────────────────── */
const CLOSED = DATA.questions.filter(q=>!q.saq);
function pickN(pool, n, excl){
  const fresh = pool.filter(q=>!excl.has(q.id));
  /* Least-seen first: rank = times dealt, so nothing repeats an (n+1)th time
     until the whole pool has been dealt n times. Misses jump the queue (-2),
     Math.random() only breaks ties among equally-seen questions. */
  const rank = q => (S.miss[q.id]?-2:0) + (S.seen[q.id]||0) + Math.random();
  return fresh.sort((a,b)=>rank(a)-rank(b)).slice(0,n);
}
function dealStratified(n){
  const out=[], excl=new Set();
  /* shares are DERIVED from the bank — her revealed question distribution —
     never typed. Announced emphasis does not get a vote. */
  const share = {};
  for(const q of CLOSED) share[q.sys]=(share[q.sys]||0)+1/CLOSED.length;
  for(const sys of ['cvs','resp','lymph','mixed']){
    const want=Math.round(n*(share[sys]||0));
    for(const q of pickN(CLOSED.filter(x=>x.sys===sys), want, excl)){ out.push(q); excl.add(q.id); }
  }
  while(out.length<n){
    const q=pickN(CLOSED, 1, excl)[0]; if(!q)break; out.push(q); excl.add(q.id);
  }
  return shuffle(out).slice(0,n);
}
function dealMini(){ return dealStratified(12) }
/* Test 1's own shape (35 Q · 20% SAQ · 65 min): 32 closed + one exam-case question +
   one of her essays. The exam-case questions rotate in order across full sittings. */
const CASEQ = DATA.cases.flatMap(c=>c.questions.map(q=>({...q, caseId:c.id, caseName:c.name, scenario:c.scenario, csys:c.sys})));
function dealFull(){
  const closed = dealStratified(32);
  const essays = DATA.questions.filter(q=>q.saq);
  const other = essays.length? essays[Math.random()*essays.length|0] : null;
  const saqs=[];
  if(CASEQ.length) saqs.push(mkCaseQ(CASEQ[(S.scores.filter(s=>s.mode==='full').length) % CASEQ.length]));
  if(other) saqs.push(other);
  return closed.concat(saqs);
}
function mkCaseQ(cq){
  return { id:'case-'+cq.caseId+'-'+cq.q.slice(0,24).replace(/\W/g,''), quiz:'case:'+cq.caseId, sys:cq.csys, type:'essay',
    pts:cq.marks, q:cq.q, imgs:[], saq:{steps:cq.steps, src:cq.src}, scenario: cq.caseName+' — '+cq.scenario };
}
function dealMisses(){
  let ids = Object.keys(S.miss).filter(id=>S.miss[id]>=2);
  if(ids.length<4) ids = Object.keys(S.miss);
  const pool = CLOSED.filter(q=>ids.includes(q.id));
  return shuffle(pool).slice(0,12);
}

let SIT=null;
function start(mode){
  let deck,label,timed=false;
  if(mode==='mini'){deck=dealMini();label='mini mock'}
  else if(mode==='full'){deck=dealFull();label='full mock';timed=true}
  else if(mode==='miss'){deck=dealMisses();label='redo misses'}
  else if(mode.startsWith('quiz:')){const z=DATA.quizzes.find(x=>x.id===mode.slice(5));
    deck=DATA.questions.filter(q=>q.quiz===z.id);label=z.name}
  else if(mode.startsWith('sys:')){const s=mode.slice(4);
    deck=shuffle(CLOSED.filter(q=>q.sys===s)).slice(0,12);label='all '+s}
  if(!deck||!deck.length){alert('Nothing to deal here yet.');return}
  SIT={deck,label,mode,i:0,ans:{},t0:Date.now(),timed,end:timed?Date.now()+65*60*1000:null};
  if(mode==='mini'&&DATA.chains.length){warmup();return}
  renderQ();
}
function warmup(){
  const ch=DATA.chains[Math.random()*DATA.chains.length|0];

  const others=shuffle(DATA.chains.filter(c=>c!==ch).flatMap(c=>c.beads.filter(b=>b.t).map(b=>b.t))).slice(0,3);

    } else renderQ()};

  /* structured stem: her paragraphs, lists and table rows, with [[IMG:…]] and
     [[BLANK:k]] markers resolved in place. Images the stem did not place still show
     below it, so no figure is ever lost. */
  const placed=new Set();
  let stemHTML=q.qh
    ? q.qh.replace(/\[\[IMG:([^\]]+)\]\]/g,(m,f)=>{placed.add(f);return imgTag(f)})
          .replace(/\[\[BLANK:(\d+)\]\]/g,(m,k)=>q.type==='cloze'&&q.blanks[+k]?widget(q.blanks[+k],+k):'____')
    : esc(q.q);
  const imgs=(q.imgs||[]).filter(f=>!placed.has(f)).map(imgTag).join('');
  const inlineBlanks=q.type==='cloze'&&q.qh&&/\[\[BLANK:\d+\]\]/.test(q.qh);
  let body='';

      <span>${esc(optLabel(q,o))}</span></label>`).join('');

  } else if(q.type==='match'){
    const bank=shuffleStable(q.id,[...new Set(q.pairs.map(p=>p.right))]); // a right-hand item used twice is still ONE option
    body=q.pairs.map((p,i)=>`<div class="blankrow"><label>${esc(p.left)}</label>

      ${bank.map(r=>`<option ${a&&a.pick&&a.pick[i]===r?'selected':''}>${esc(r)}</option>`).join('')}</select></div>`).join('');
  } else if(q.type==='cloze'){
    body=inlineBlanks
      ? `<div class="note">${q.bk==='dd'?'Pick from each dropdown in the text.':'Type into each blank in the text — spelling counts, capitals don’t.'}</div>`
      : q.blanks.map((b,i)=>`<div class="blankrow"><label>${esc(blankLabel(b,i))}${q.bk==='dd'?'':' (type it)'}</label>${widget(b,i)}</div>`).join('');
  } else if(q.type==='essay'){
    body=`${q.scenario?`<div class="note">${esc(q.scenario)}</div>`:''}
      <div class="note">Written question · ${q.pts} marks — write ${q.pts} numbered points, one causal step each. You mark yourself against the model at the end.</div>
      <textarea data-essay placeholder="1. …&#10;2. …">${a&&a.text?esc(a.text):''}</textarea>`;
  }
  $('#view').innerHTML=`<div class="card">
    <div class="qhead"><span class="n">Q${SIT.i+1}/${SIT.deck.length}</span>
      <span class="tag ${q.sys}">${q.sys}</span><span class="tag">${q.pts} mk</span>
      <span class="timer" id="timer"></span>
      <button class="btn ghost" id="exitB" title="abandon mock test" style="padding:2px 10px">✕</button></div>
    ${inlineBlanks?body:''}<div class="stem${q.qh?' rich':''}">${stemHTML}</div>${imgs}${inlineBlanks?'':body}
    <div class="pips">${SIT.deck.map((_,i)=>`<span class="pip ${SIT.ans[SIT.deck[i].id]?'done':''} ${i===SIT.i?'cur':''}"></span>`).join('')}</div>
  </div>`;
  document.querySelectorAll('.opt').forEach(o=>o.onclick=e=>{
    const inp=o.querySelector('input');
    if(inp.type==='radio'){document.querySelectorAll('.opt').forEach(x=>{x.classList.remove('sel');x.querySelector('input').checked=false});inp.checked=true;o.classList.add('sel')}
    else{if(e.target.tagName!=='INPUT')inp.checked=!inp.checked;o.classList.toggle('sel',inp.checked)}
  });
  if(SIT.timed){const t=$('#timer');const tick=()=>{const s=Math.max(0,(SIT.end-Date.now())/1000|0);
    t.textContent=`${s/60|0}:${String(s%60).padStart(2,'0')}`;t.classList.toggle('low',s<300);
    if(s<=0){clearInterval(timerIv);saveAns();mark()}};tick();timerIv=setInterval(tick,1000)}

function shuffleStable(seed,arr){
  let h=0;for(const c of String(seed))h=(h*31+c.charCodeAt(0))>>>0;
  return arr.map((v,i)=>({v,k:(h=(h*1103515245+12345)>>>0)})).sort((a,b)=>a.k-b.k).map(x=>x.v);
}
function saveAns(){
  const q=SIT.deck[SIT.i];
  if(q.type==='essay'){const t=document.querySelector('[data-essay]');if(t&&t.value.trim())SIT.ans[q.id]={text:t.value};return}
  if(q.type==='match'||q.type==='cloze'){
    const pick={};let any=false;
    document.querySelectorAll('[data-i]').forEach(el=>{if(el.value){pick[el.dataset.i]=el.value;any=true}});
    if(any)SIT.ans[q.id]={pick};return}
  const sel=[...document.querySelectorAll('.opt input:checked')].map(i=>+i.value);
  if(sel.length)SIT.ans[q.id]={sel};
}
/* ── marking ───────────────────────────────────────────────────────── */
function markQ(q,a){
  if(q.type==='essay')return null; // self-marked
  if(!a)return{got:0,tot:q.pts,detail:'no answer'};
  if(q.type==='mcq'||q.type==='tf'||q.type==='multi'){
    const chosen=(a.sel||[]).map(i=>q.opts[i]);
    const right=chosen.length===q.key.length&&q.key.every(k=>chosen.includes(k));
    return{got:right?q.pts:0,tot:q.pts,you:chosen.map(o=>optLabel(q,o)).join(' · ')}}
  if(q.type==='match'){
    let got=0;q.pairs.forEach((p,i)=>{if((a.pick||{})[i]===p.right)got++});
    return{got:got*q.pts/q.pairs.length,tot:q.pts,you:q.pairs.map((p,i)=>(a.pick||{})[i]||'—').join(' · ')}}
  if(q.type==='cloze'){
    let got=0;
    q.blanks.forEach((b,i)=>{if(blankOK(q,b,(a.pick||{})[i]))got++});
    return{got:got*q.pts/q.blanks.length,tot:q.pts,you:q.blanks.map((b,i)=>(a.pick||{})[i]||'—').join(' · ')}}
}
/* dropdown: only her marked option is right. Typed: every accepted spelling is. */
function blankOK(q,b,v){
  /* phones type curly quotes; a trailing full stop is not a wrong answer */
  const nrm=s=>String(s||'').toLowerCase().replace(/[’‘`´]/g,"'").replace(/[“”]/g,'"').replace(/\s+/g,' ').trim().replace(/[.]+$/,'');
  const x=nrm(v);if(!x)return false;
  const also=(b.also||[]).some(o=>nrm(o)===x);
  return q.bk==='dd' ? (x===nrm(b.correct)||also) : (b.options.some(o=>nrm(o)===x)||also);
}
function blankLabel(b,i){return b.ctx?`${b.ctx} ___`:(b.label&&!/^Answer \d+:?$/.test(b.label)?b.label.replace(/:$/,''):`Blank ${i+1}`)}
function mark(){
  clearInterval(timerIv);$('#footbar').classList.remove('on');
  let got=0,tot=0;const rows=[];
  for(const q of SIT.deck){
    const r=markQ(q,SIT.ans[q.id]);
    S.seen[q.id]=(S.seen[q.id]||0)+1;
    if(r){got+=r.got;tot+=r.tot;
      if(r.got<r.tot)S.miss[q.id]=(S.miss[q.id]||0)+1;
      else if(S.miss[q.id])delete S.miss[q.id];
      rows.push({q,r})}
    else rows.push({q,r:null,saq:true});
  }
  SIT.auto={got,tot};
  const saqs=rows.filter(x=>x.saq);
  $('#view').innerHTML=`<div class="card">
    <div class="score-hero" id="hero"></div><div class="score-sub" id="heroSub"></div>
    ${saqs.length?`<div class="note">Tick each model step your written answer actually hit — the score updates as you go. Model answers are the tool’s unless the source line under them says the words are hers.</div>`:''}
    ${rows.map(({q,r,saq},i)=>{
      if(saq){const a=SIT.ans[q.id];
        return `<div class="mk" id="mk${i}"><b>${esc(flatStem(q))}</b>
        ${a&&a.text?`<div class="you">You wrote:<br>${esc(a.text).replace(/\n/g,'<br>')}</div>`:'<div class="you">— no answer written —</div>'}
        <div class="steps">${q.saq.steps.map((s,si)=>`<label><input type="checkbox" data-saq="${i}" data-pt="${q.pts/q.saq.steps.length}"> <span>${esc(s)}</span></label>`).join('')}</div>
        <div class="src">${esc(q.saq.src)}</div></div>`}
      const cls=r.got>=r.tot?'right':'wrong';
      return `<div class="mk ${cls}"><b>${esc(flatStem(q)).slice(0,300)}</b>
        <div class="marks">${(+r.got.toFixed(1))}/${r.tot} mk · ${esc(DATA.quizzes.find(z=>z.id===q.quiz)?.name||q.quiz)}</div>
        ${q.type==='mcq'||q.type==='tf'||q.type==='multi'?(r.you?`<div class="you">You: ${esc(r.you)}</div>`:`<div class="you">${r.detail||''}</div>`):''}
        ${r.got<r.tot?`${keyHTML(q,SIT.ans[q.id])}${explainHTML(q)}`:''}</div>`}).join('')}
    ${weakSpotsHTML(rows)}
    <button class="btn primary wide" id="doneB">Save score & finish</button></div>`;
  const upd=()=>{
    let s=0;document.querySelectorAll('[data-saq]:checked').forEach(c=>s+=+c.dataset.pt);
    const saqTot=saqs.reduce((n,{q})=>n+q.pts,0);
    const g=got+s,t=tot+saqTot;
    $('#hero').textContent=`${+g.toFixed(1)} / ${t}`;
    $('#heroSub').textContent=`${Math.round(100*g/t)}% · ${SIT.label} · ${Math.round((Date.now()-SIT.t0)/60000)} min`;
    SIT.final={got:+g.toFixed(1),tot:t}};
  document.querySelectorAll('[data-saq]').forEach(c=>c.onchange=upd);upd();
  $('#doneB').onclick=()=>{
    S.scores.push({t:Date.now(),mode:SIT.mode,label:SIT.label,got:SIT.final.got,tot:SIT.final.tot});
    SV('scores',S.scores);SV('miss',S.miss);SV('seen',S.seen);home();window.scrollTo(0,0)};
  SV('miss',S.miss);SV('seen',S.seen);
  window.scrollTo(0,0);
}
/* the explain row: her material first, then the right-sized video, then Ask AI.
   Only on wrong answers, never during a sitting. */
function explainHTML(q){
  let h='';
  if(q.ref&&q.ref.slide)h+=`<div class="refq slide"><a href="img/slides/${q.ref.slide}" target="_blank" rel="noopener"><img class="slideimg" src="img/slides/${q.ref.slide}" alt="her slide" loading="lazy"></a><span class="refsrc">📖 ${esc(q.ref.src)} — tap to open full size</span></div>`;
  else if(q.ref)h+=`<div class="refq">📖 <i>“${esc(q.ref.t)}”</i><span class="refsrc"> — ${esc(q.ref.src)}</span></div>`;
  if(q.vid)h+=vidRowHTML(q.vid)+(q.vid.alt?vidRowHTML(q.vid.alt,'also · '):'');
  h+=`<button class="btn ghost askai" data-ask="${q.id}">🤖 Copy for AI</button>`;
  return h;
}
/* a video link opens at the moment its captions say the tested point is taught —
   `at` is where the verifying quote was found, not a guess */
const mmss=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function vidRowHTML(v,who){
  who=who??(v.ch==='nn'?'Ninja Nerd · ':'Dr Matt &amp; Dr Mike · ');
  const at=Number.isInteger(v.at)?v.at:0;
  return `<div class="vidrow">▶ <a href="https://www.youtube.com/watch?v=${v.id}${at?`&t=${at}s`:''}" target="_blank" rel="noopener">${esc(v.t)}</a> <span class="refsrc">${who}${esc(v.d)}${at?` · from ${mmss(at)}`:''}</span></div>`;
}
function weakSpotsHTML(rows){
  const missed=rows.filter(x=>!x.saq&&x.r&&x.r.got<x.r.tot).map(x=>x.q);
  if(missed.length<3)return '';
  const vids=new Map();
  for(const q of missed) if(q.vid){ if(!vids.has(q.vid.id)) vids.set(q.vid.id,q.vid); if(q.vid.alt&&!vids.has(q.vid.alt.id)) vids.set(q.vid.alt.id,q.vid.alt); }
  if(!vids.size)return '';
  const bySys={};for(const q of missed)bySys[q.sys]=(bySys[q.sys]||0)+1;
  const worst=Object.entries(bySys).sort((a,b)=>b[1]-a[1])[0];
  return `<div class="note" style="border-left-color:var(--primary)">
    <b>Weak spots this mock test</b> — ${missed.length} missed, most in ${SYS[worst[0]]||worst[0]}.
    Watch these before your next sitting:
    ${[...vids.values()].slice(0,4).map(v=>vidRowHTML(v)).join('')}
    <div class="refsrc">Each video was matched to its question from the video's own captions and checked twice, and the link opens where that point is taught. Where a video and Hannetjie disagree, she wins.
    <a href="https://jeremyspm.github.io/hs2-m1-videos.html" target="_blank" rel="noopener">All ${DATA.stats.videos} by topic ↗</a></div></div>`;
}
/* readable key rendering: matching and cloze get one ROW per part, wrong parts
   annotated with what you picked — never a run-on paragraph */
function keyHTML(q,a){
  if(q.type==='match')return `<div class="keyrows">${q.pairs.map((p,i)=>{
    const yours=(a&&a.pick||{})[i];const wrong=yours&&yours!==p.right;
    return `<div class="krow ${yours===p.right?'kok':''}">${esc(p.left)} <b>→ ${esc(p.right)}</b>${wrong?` <span class="kyou">you: ${esc(yours)}</span>`:yours?'':' <span class="kyou">unanswered</span>'}</div>`}).join('')}</div>`;
  if(q.type==='cloze')return `<div class="keyrows">${q.blanks.map((b,i)=>{
    const yours=(a&&a.pick||{})[i];
    const right=blankOK(q,b,yours);
    const alt=q.bk==='fib'&&b.options.length>1?` <span class="refsrc">(also accepted: ${esc(b.options.filter(o=>o!==b.correct).join(', '))})</span>`:'';
    return `<div class="krow ${right?'kok':''}">${esc(blankLabel(b,i))} <b>→ ${esc(b.correct)}</b>${alt}${yours&&!right?` <span class="kyou">you: ${esc(yours)}</span>`:yours?'':' <span class="kyou">unanswered</span>'}</div>`}).join('')}</div>`;
  return `<div class="keyline">Key: ${esc(keyText(q))}</div>`;
}
function keyText(q){
  if(q.type==='match')return q.pairs.map(p=>`${p.left} → ${p.right}`).join(' · ');
  if(q.type==='cloze')return q.blanks.map(b=>b.correct).join(' · ');
  return (q.key||[]).map(o=>optLabel(q,o)).join(' · ');
}
/* bare-letter options carry their text from the stem's lettered list (build-time) */
function optLabel(q,o){return q.ol&&q.ol[o]?`${o}. ${q.ol[o]}`:o}
/* the flat stem carries Canvas's literal "[ Select ]" where each dropdown sat */
const flatStem=q=>q.qt||String(q.q||'').replace(/\[ Select \]/g,'____');
